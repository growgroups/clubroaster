<style>
:root{--b:#2855A6;--bd:#214887;--bs:#EEF4FF;--bg:#F3F5F9;--side:#F8FAFD;--ink:#172033;--muted:#667085;--line:#E6EAF0;--green:#157347;--gb:#EAF8F0;--amber:#9A6700;--ab:#FFF7E2;--red:#B42318;--rb:#FDECEC;--purple:#6941C6;--pb:#F2EEFF;--shadow:0 1px 3px #10182814}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex;gap:12px;padding:12px}.sidebar{width:288px;height:calc(100vh - 24px);position:sticky;top:12px;background:var(--side);border-radius:28px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);overflow:auto}.brand{background:#fff;border-radius:18px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow)}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--b);color:#fff;font-weight:900}.brand small{display:block;color:var(--muted)}.navlabel{font-size:10px;font-weight:800;letter-spacing:.08em;color:#98A2B3;margin:17px 8px 6px}.nav{background:#fff;border-radius:16px;padding:7px;box-shadow:var(--shadow)}.nav button{width:100%;border:0;background:transparent;color:#667085;text-align:left;padding:9px 10px;border-radius:9px;font-size:12px;margin:1px 0}.nav button:hover{background:#F7F8FA}.nav button.active{background:var(--bs);color:var(--b);font-weight:800}.ask{border:0;background:var(--b);color:#fff;border-radius:16px;padding:12px;font-weight:800}.main{flex:1;min-width:0;max-width:calc(100vw - 324px)}.top{position:sticky;top:12px;z-index:20;background:#fff;border-radius:20px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow)}.crumb small{display:block;font-size:11px;color:#98A2B3}.crumb button{border:0;background:transparent;padding:0;color:inherit}.crumb button:hover{color:var(--b);text-decoration:underline}.crumb strong{font-size:14px}.actions{display:flex;align-items:center;gap:8px}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:10px;font-weight:800}.pill.green{background:var(--gb);color:var(--green)}.pill.blue{background:var(--bs);color:var(--b)}select,.btn,input,textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;color:#475467;font-size:11px}.btn{font-weight:800}.btn.primary{background:var(--b);border-color:var(--b);color:#fff}.btn.soft{background:var(--bs);color:var(--b)}.btn.danger{color:var(--red);border-color:#F5C7C2}.content{padding:12px 0 30px}.pagehead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin:8px 2px 14px}.pagehead h1{font-size:24px;margin:0 0 5px}.pagehead p{margin:0;color:var(--muted);font-size:12px;max-width:850px}.headactions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:1.45fr 1fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}.card h2,.card h3{margin:0 0 5px}.sub{font-size:10px;color:var(--muted);margin-bottom:12px}.kpi strong{font-size:28px;display:block;margin:9px 0 2px}.tag{display:inline-flex;border-radius:999px;padding:4px 7px;font-size:9px;font-weight:800}.green{background:var(--gb);color:var(--green)}.amber{background:var(--ab);color:var(--amber)}.red{background:var(--rb);color:var(--red)}.blue{background:var(--bs);color:var(--b)}.purple{background:var(--pb);color:var(--purple)}.bar{height:7px;background:#EEF1F5;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--b)}.metric{display:grid;grid-template-columns:100px 1fr 42px;gap:8px;align-items:center;font-size:10px;margin:8px 0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:9px 10px;border-bottom:1px solid #EEF1F4;text-align:left;font-size:10px;white-space:nowrap}th{background:#F8FAFC;color:#667085;text-transform:uppercase;font-size:9px}.exception{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px;margin:7px 0}.exicon{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;background:var(--bs);color:var(--b);font-weight:900;flex:none}.exception b{font-size:10px}.exception p{font-size:9px;color:var(--muted);margin:3px 0}.exception button{margin-left:auto}.flow{display:flex;gap:7px;align-items:center;overflow:auto}.node{min-width:120px;border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center;font-size:9px;font-weight:800;cursor:pointer}.node:hover{background:#F5F8FF;border-color:#A9BEE7}.node.blue{background:var(--bs);color:var(--b)}.arrow{color:#98A2B3}.board{display:grid;grid-template-columns:70px repeat(4,minmax(175px,1fr));gap:7px;overflow:auto}.court,.time,.game{border:1px solid var(--line);border-radius:11px;padding:9px}.court,.time{background:#F8FAFC;text-align:center;font-size:10px;font-weight:800}.game{min-height:105px;cursor:pointer}.game:hover{border-color:#A9BEE7}.game b{font-size:10px}.game small{display:block;color:var(--muted);margin:3px 0 7px}.official{background:#F8FAFC;border-radius:7px;padding:5px;margin:4px 0;font-size:9px}.official.empty{background:#FFF7F7;color:var(--red);border:1px dashed #F3B9B4}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar input{min-width:220px}.phone{max-width:365px;margin:auto;border:8px solid #1F2937;border-radius:34px;padding:10px;background:var(--bg)}.phonecard{background:#fff;border-radius:17px;padding:14px;margin-bottom:10px}.big{width:100%;border:0;border-radius:12px;background:var(--b);color:#fff;padding:11px;font-weight:800;margin-top:7px}.big.secondary{background:var(--bs);color:var(--b)}.notice{background:var(--ab);color:#7A5B00;border:1px solid #F2DFA6;padding:9px;border-radius:9px;font-size:9px}.timeline .event{border-left:2px solid #DCE7FB;padding:2px 0 12px 12px;margin-left:5px}.timeline strong{font-size:10px}.timeline p{font-size:9px;color:var(--muted);margin:3px 0}.drawerback{position:fixed;inset:0;background:#10182855;display:none;z-index:50}.drawerback.open{display:block}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(450px,94vw);background:#fff;z-index:51;transform:translateX(100%);transition:.2s;box-shadow:-10px 0 35px #10182822;padding:18px;overflow:auto}.drawer.open{transform:translateX(0)}.drawerhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.drawerhead button{border:0;background:#F2F4F7;border-radius:9px;padding:7px 10px}.field{margin:9px 0}.field label{display:block;font-size:10px;font-weight:800;color:#667085;margin-bottom:4px}.field input,.field textarea,.field select{width:100%}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;border-radius:11px;padding:10px 14px;font-size:10px;opacity:0;pointer-events:none;transition:.2s;z-index:80}.toast.show{opacity:1}.large{font-size:115%}.simple .advanced{display:none!important}.mobilemenu{display:none}.check{display:flex;gap:8px;align-items:flex-start}.check input{margin-top:3px}.statusline{font-size:10px;color:var(--muted);margin-top:8px}@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.three{grid-template-columns:1fr 1fr}}@media(max-width:760px){.app{display:block;padding:0}.sidebar{position:fixed;left:0;top:0;height:100vh;z-index:60;border-radius:0;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{max-width:none}.top{top:0;border-radius:0}.content{padding:10px}.kpis,.three{grid-template-columns:1fr}.actions .pill{display:none}.pagehead{flex-direction:column}.mobilemenu{display:inline-block}.board{grid-template-columns:60px repeat(4,170px)}}
</style>

<body>
<div class="app" id="app">
<aside class="sidebar" id="sidebar"><div><div class="brand"><div class="logo">CR</div><div><b>ClubRoster</b><small>Pizzey Park Pilot</small></div></div><div id="nav"></div></div><button class="ask" data-action="ai">✦ Ask Roster AI</button></aside>
<main class="main"><header class="top"><div style="display:flex;gap:10px;align-items:center"><button class="btn mobilemenu" data-action="menu">☰</button><div class="crumb"><small><button data-action="home">Pizzey Park Netball Club</button> / <button id="contextCrumb" data-action="season">2026 Winter</button></small><strong><button id="pageCrumb" data-action="current">Dashboard</button></strong></div></div><div class="actions"><span class="pill green">● Concept data</span><span class="pill blue">Pilot: Pizzey Park</span><select id="role"></select><button class="btn" data-action="large">Aa</button><button class="btn" data-action="simple">Simple</button></div></header><section class="content" id="content"></section></main>
</div>
<div class="drawerback" id="back" data-action="close"></div><aside class="drawer" id="drawer"><div class="drawerhead"><b id="drawerTitle">Details</b><button data-action="close">✕</button></div><div id="drawerBody"></div></aside><div class="toast" id="toast"></div>
<script>
const roles={clubAdmin:'Club Administrator',associationAdmin:'Association Administrator',coordinator:'Umpire Coordinator',mentor:'Mentor / Coach',finance:'Finance / Payments',supervisor:'Game-day Supervisor',adult:'Adult Umpire',junior:'Junior Umpire',guardian:'Parent / Guardian',audit:'Read-only / Audit'};
const pages={dashboard:'Dashboard',import:'Season Import',fixtures:'Fixtures',umpires:'Umpires',availability:'Availability',roster:'Roster Board',exceptions:'Exceptions',gameday:'Game Day',payments:'Match Fees',reports:'Reports',notifications:'Notifications',rules:'Rules & Supply',roles:'Roles & Access',junior:'Junior & Guardian',mobile:'Mobile Experience',audit:'Audit Trail',blueprint:'Software Blueprint',playbook:'Playbook',actionplan:'Action Plan'};
const sections=[['NAV',['dashboard','import','fixtures','umpires','availability','roster']],['OPERATIONS',['exceptions','gameday','payments','reports','notifications']],['ADM',['rules','roles','junior','mobile','audit','blueprint','playbook','actionplan']]];
const access={clubAdmin:Object.keys(pages),associationAdmin:['dashboard','import','fixtures','umpires','availability','roster','exceptions','reports','notifications','rules','roles','audit','blueprint','actionplan'],coordinator:['dashboard','fixtures','umpires','availability','roster','exceptions','gameday','reports','notifications','rules','junior','mobile','playbook','actionplan'],mentor:['dashboard','umpires','availability','roster','reports','notifications','junior','mobile'],finance:['dashboard','payments','reports','audit'],supervisor:['dashboard','roster','exceptions','gameday','notifications','mobile'],adult:['dashboard','availability','mobile','notifications'],junior:['dashboard','availability','junior','mobile','notifications'],guardian:['dashboard','availability','junior','notifications'],audit:['dashboard','fixtures','umpires','roster','payments','reports','audit','blueprint','playbook','actionplan']};
let role='clubAdmin',page='dashboard',state={imported:false,published:false,approved:false,checkedIn:false,guardianAck:false,reminders:0};
const fixtures=[['GC-260801','Gold Coast Netball','8','22 Aug · 8:00','U12 · Div 1','Pizzey 1 v Mudgeeraba 1','Pizzey Park · C1','Scheduled'],['GC-260802','Gold Coast Netball','8','22 Aug · 9:20','Premier · A','Pizzey A v Palm Beach A','Pizzey Park · C2','Changed'],['GC-260803','Gold Coast Netball','8','22 Aug · 10:40','U14 · Div 2','Pizzey 5 v Coomera 3','Pizzey Park · C3','Scheduled'],['QR-160622','Queensland Rep','5','23 Aug · 11:00','U16 · Rep','Gold Coast v Sunshine Coast','Carrara · C4','Scheduled'],['GC-260815','Gold Coast Netball','8','22 Aug · 2:40','U14 · Div 1','Pizzey 3 v Runaway Bay','Pizzey Park · C3','Cancelled']];
function tag(t,c='blue'){return `<span class="tag ${c}">${t}</span>`}function btn(t,a,c=''){return `<button class="btn ${c}" data-action="${a}">${t}</button>`}function head(t,p,a=''){return `<div class="pagehead"><div><h1>${t}</h1><p>${p}</p></div><div class="headactions">${a}</div></div>`}function kpi(v,l,t='',c='blue'){return `<div class="card kpi">${t?tag(t,c):''}<strong>${v}</strong><small>${l}</small></div>`}function ex(i,t,p,a='',c='blue'){return `<div class="exception"><div class="exicon ${c}">${i}</div><div><b>${t}</b><p>${p}</p></div>${a}</div>`}function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function flow(items){return `<div class="flow">${items.map((x,i)=>`${i?'<div class="arrow">→</div>':''}<div class="node ${i===0||i===3?'blue':''}" data-go="${x[1]}">${x[0]}</div>`).join('')}</div>`}
function dashboard(){return head('Saturday control centre','Round 8 coverage, qualifications, confirmations, fixture changes and action items.',btn('✦ Generate roster','generate','primary'))+`<div class="grid kpis">${kpi('186','Games across all divisions','Round 8')}${kpi('349','Umpire positions allocated','94% filled','green')}${kpi('23','Exceptions requiring review','11 urgent','red')}${kpi(state.published?'349':'318',state.published?'Published appointments':'Confirmed appointments',state.published?'Published':'31 pending',state.published?'green':'amber')}</div><div class="grid two" style="margin-top:12px"><div class="card"><h2>Roster health</h2><div class="sub">AutoRoster score for Round 8</div>${[['Coverage',94],['Qualifications',100],['Availability',99],['Fairness',91],['Preferences',84]].map(x=>`<div class="metric"><span>${x[0]}</span><div class="bar"><i style="width:${x[1]}%"></i></div><b>${x[1]}%</b></div>`).join('')}</div><div class="card"><h2>Exceptions inbox</h2>${ex('!','Premier game missing Level 3 umpire','9:20am · Court 2 · Premier A',btn('Resolve','repair'),'red')}${ex('↔','Fixture time changed after publication','U15 Div 1 moved from 12:00pm to 1:20pm',btn('Review','fixtures'),'amber')}${ex('i','8 appointments awaiting confirmation','Reminder scheduled Thursday 5:00pm',btn('Remind','remind'))}</div></div><div class="card" style="margin-top:12px"><h2>Saturday workflow</h2>${flow([['Bulk season import','import'],['Validate changes','fixtures'],['Availability','availability'],['AutoRoster','roster'],['Exceptions','exceptions'],['Publish','roster'],['Game day','gameday'],['Match fees','payments'],['Reports','reports']])}</div>`}
function importer(){return head('Bulk season fixture import','Load a full season across associations, age groups, divisions, venues and courts.',btn('Download template','template')+btn('Run demo import','doImport','primary'))+`<div class="grid two"><div class="card"><h3>Upload season files</h3><div class="sub">Excel, CSV or multiple association files</div><input id="file" type="file" multiple><div class="statusline" id="fileStatus">No files selected. Demo data remains local to this concept.</div><div style="margin-top:12px">${btn('Choose demo file','pickFile','soft')}</div></div><div class="card"><h3>Intelligent mapping</h3>${ex('→','Match Date → Date','98% confidence · saved association alias')}${ex('→','Grade → Division / grade','95% confidence')}${ex('?','Comp → Competition','Schools Cup requires confirmation',btn('Confirm mapping','confirmMap'),'amber')}</div></div><div class="grid three" style="margin-top:12px">${kpi(state.imported?'2,200':'—','Fixtures detected')}${kpi(state.imported?'76':'—','Changes detected')}${kpi(state.imported?'16':'—','Validation issues')}</div>${state.imported?`<div class="card" style="margin-top:12px">${ex('✓','Import ready for preview','2,184 rows clean · 16 issues to review',btn('Open fixtures','fixtures','primary'),'green')}</div>`:''}`}
function fixturesPage(){let rows=fixtures.map(r=>[...r.slice(0,7),tag(r[7],r[7]==='Scheduled'?'green':r[7]==='Changed'?'amber':'red'),btn('Open','fixtureDetail')]);return head('Season fixtures','Master fixture register. Updates modify existing games rather than duplicating them.',btn('Import update','import')+btn('Export CSV','export','soft'))+`<div class="card"><div class="toolbar"><input id="search" placeholder="Search game, club, grade or venue"><select id="assoc"><option value="">All associations</option><option>Gold Coast Netball</option><option>Queensland Rep</option></select><button class="btn" data-action="filterFixtures">Apply filters</button></div><div id="fixtureTable">${table(['Game ID','Association','Round','Date/time','Grade','Game','Venue','Status','Action'],rows)}</div></div>`}
function umpiresPage(){let rows=[['Ella Jones','Junior · 12','Level 1','Developing','Guardian linked','18','100%',tag('Active','green')],['Lucy Harris','Junior · 14','Level 1','Developing+','Guardian linked','31','97%',tag('Active','green')],['Chloe Nguyen','Adult · 34','Level 2','Strong','Independent','62','99%',tag('Active','green')],['Karen Wilson','Adult · 47','Level 3','Senior mentor','Independent','91','100%',tag('Active','green')],['Helen Adams','Senior · 68','Level 2','Strong','Large text','73','99%',tag('Active','green')],['Margaret Lee','Senior · 79','Level 2','Strong','Limited availability','28','100%',tag('Active','green')]].map(r=>[...r,btn('Profile','umpireProfile')]);return head('Umpire database','One age-aware profile per official, from age 10 through senior adults.',btn('Bulk invite','bulkInvite')+btn('＋ Add umpire','addUmpire','primary'))+`<div class="grid kpis">${kpi('171','Active umpires')}${kpi('46','Junior accounts under 18')}${kpi('22','Level 3 / senior officials')}${kpi('7','Credentials expiring in 60 days','Review','amber')}</div><div class="card" style="margin-top:12px">${table(['Umpire','Age band','Accreditation','Competency','Access','Games','Attendance','Status','Action'],rows)}</div>`}
function availabilityPage(){return head('Availability','Recurring and round-specific availability with age-aware limits and guardian assistance.',btn('Send reminders','remind')+btn('Set availability','setAvailability','primary'))+`<div class="grid three">${kpi('164 / 171','Round 8 responses','96%','green')}${kpi('48 / 51','Junior responses','Guardian-aware')}${kpi('4','Level 3 shortage windows','Forecast','amber')}</div><div class="card" style="margin-top:12px">${table(['Official','8:00','9:20','10:40','12:00','1:20','2:40','Max'],[['Ella J',tag('Prefer','blue'),tag('Yes','green'),tag('Yes','green'),tag('No','red'),tag('No','red'),tag('No','red'),'2'],['Karen W',tag('No','red'),tag('Yes','green'),tag('Prefer','blue'),tag('Yes','green'),tag('Yes','green'),tag('Yes','green'),'5'],['Helen A',tag('No','red'),tag('Yes','green'),tag('Yes','green'),tag('Yes','green'),tag('Yes','green'),tag('No','red'),'3']])}</div>`}
function rosterPage(){return head('Roster board','Hard constraints block invalid appointments. Soft constraints optimise fairness, mentoring and preferences.',btn('Repair roster','repair')+btn('Save version','saveVersion')+btn(state.published?'Published':'Publish roster','publish','primary'))+`<div class="card"><div class="board"><div></div>${[1,2,3,4].map(c=>`<div class="court">Court ${c}</div>`).join('')}<div class="time">8:00</div>${[['U12 Div 1','Pizzey 1 v Mudgeeraba 1','Ella J · L1','Grace T · L1','green'],['U13 Div 2','Southport 2 v Pizzey 4','Jade M · L2','Ruby S · L1','green'],['U14 Div 1','Pizzey 3 v Runaway Bay','Mia P · L2','Lucy H · Pending','amber'],['U12 Div 3','Surfers 4 v Pizzey 6','Sophie K · L1','Ava D · L1','green'],['U15 Div 1','Pizzey 2 v Burleigh 2','Chloe N · L2','Olivia B · L2','green'],['Premier A','Pizzey A v Palm Beach A','Karen W · L3','+ Required Level 3','red'],['U14 Div 2','Pizzey 5 v Coomera 3','Emily F · L2','Lucy H · L1','green'],['U16 Div 1','Helensvale v Pizzey 1','Donna R · L2','Helen A · L2','green']].map((g,i)=>`${i===4?'<div class="time">9:20</div>':''}<div class="game" data-action="assignment"><b>${g[0]}</b><small>${g[1]}</small><div class="official">${g[2]}</div><div class="official ${g[4]==='red'?'empty':''}">${g[3]}</div></div>`).join('')}</div></div><div class="grid two" style="margin-top:12px"><div class="card"><h3>Explain this assignment</h3>${ex('✓','Available and qualified','No overlap, club conflict or age-rule issue.')}${ex('✓','Development pairing achieved','Junior official has senior support nearby.')}</div><div class="card"><h3>Minimum-change repair</h3><p class="sub">Repair withdrawals while disrupting the fewest appointments.</p>${btn('Find 3 eligible replacements','repair','primary')}</div></div>`}
function exceptionsPage(){return head('Exceptions inbox','All hard conflicts, warnings, confirmations and fixture-change impacts in one queue.',btn('Refresh','refresh')+btn('Repair selected','repair','primary'))+`<div class="card">${ex('!','Missing Level 3 official','Premier A · Court 2 · 9:20am',btn('Find replacement','repair'),'red')}${ex('↔','Changed fixture invalidates availability','U15 Div 1 moved to 1:20pm',btn('Review umpire','assignment'),'amber')}${ex('G','Guardian acknowledgement required','Junior appointment changed after publication',btn('Request ack','guardianAck'),'amber')}${ex('i','8 appointments unconfirmed','No response after initial publish',btn('Send reminder','remind'))}${ex('≈','Fairness imbalance','3 Level 2 officials have materially fewer allocations',btn('Rebalance','repair'))}</div>`}
function gamedayPage(){let rows=[['9:20','2','Premier A','Karen W',tag(state.checkedIn?'Arrived':'Expected',state.checkedIn?'green':'blue'),btn(state.checkedIn?'Checked in':'Check in','checkin')],['9:20','2','Premier A','Unfilled',tag('Missing','red'),btn('Replace','emergency','danger')],['10:40','1','U13 Div 1','Ruby S',tag('Not yet','amber'),btn('Ping','ping')],['10:40','1','U13 Div 1','Mentor TBD',tag('Attention','amber'),btn('Assign','assignment')]];return head('Game-day operations','Arrival, no-shows, emergency replacement, incidents and match completion.',btn('Print court pack','print')+btn('Emergency replacement','emergency','primary'))+`<div class="grid kpis">${kpi('64','Appointments today')}${kpi(state.checkedIn?'52':'51','Checked in')}${kpi('2','Late / attention','Live','amber')}${kpi('0','Confirmed no-shows','Good','green')}</div><div class="card" style="margin-top:12px">${table(['Time','Court','Game','Official','Check-in','Action'],rows)}</div>`}
