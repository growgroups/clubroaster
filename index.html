<style>

:800}.green{background:var(--gb);color:var(--green)}.blue{background:var(--bs);color:var(--b)}.amber{background:var(--ab);color:var(--amber)}.red{background:var(--rb);color:var(--red)}.purple{background:var(--pb);color:var(--purple)}select,.btn,input,textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;color:#475467;font-size:11px}.btn{font-weight:800}.btn.primary{background:var(--b);border-color:var(--b);color:#fff}.content{padding:12px 0 30px}.pagehead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin:8px 2px 14px}.pagehead h1{font-size:24px;margin:0 0 5px}.pagehead p{margin:0;color:var(--muted);font-size:12px;max-width:900px}.headactions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:1.4fr 1fr}.card{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}.card h2,.card h3{margin:0 0 6px}.sub{font-size:10px;color:var(--muted);margin-bottom:12px}.kpi strong{display:block;font-size:28px;margin:9px 0 2px}.tag{display:inline-flex;border-radius:999px;padding:4px 7px;font-size:9px;font-weight:800}.metric{display:grid;grid-template-columns:115px 1fr 48px;gap:8px;align-items:center;font-size:10px;margin:8px 0}.bar{height:7px;border-radius:99px;background:#EEF1F5;overflow:hidden}.bar i{display:block;height:100%;background:var(--b)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:9px 10px;border-bottom:1px solid #EEF1F4;text-align:left;font-size:10px;white-space:nowrap}th{background:#F8FAFC;color:#667085;text-transform:uppercase;font-size:9px}.task{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px;margin:7px 0}.taskicon{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;background:var(--bs);color:var(--b);font-weight:900;flex:none}.task b{font-size:10px}.task p{font-size:9px;color:var(--muted);margin:3px 0}.task button{margin-left:auto}.flow{display:flex;gap:7px;align-items:center;overflow:auto}.node{min-width:120px;border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center;font-size:9px;font-weight:800;cursor:pointer}.node.blue{background:var(--bs);color:var(--b)}.arrow{color:#98A2B3}.board{display:grid;grid-template-columns:70px repeat(3,minmax(235px,1fr));gap:7px;overflow:auto}.court,.time,.game{border:1px solid var(--line);border-radius:11px;padding:9px}.court,.time{background:#F8FAFC;text-align:center;font-size:10px;font-weight:800}.game{min-height:145px;cursor:pointer}.game b{font-size:10px}.game small{display:block;color:var(--muted);margin:3px 0 7px}.official{background:#F8FAFC;border-radius:7px;padding:5px;margin:4px 0;font-size:9px}.coach{background:var(--pb);color:var(--purple);border-radius:7px;padding:6px;margin:5px 0;font-size:9px;font-weight:700}.empty{background:#FFF7F7!important;color:var(--red)!important;border:1px dashed #F3B9B4}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.drawerback{position:fixed;inset:0;background:#10182855;display:none;z-index:50}.drawerback.open{display:block}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(500px,94vw);background:#fff;z-index:51;transform:translateX(100%);transition:.2s;box-shadow:-10px 0 35px #10182822;padding:18px;overflow:auto}.drawer.open{transform:translateX(0)}.drawerhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.drawerhead button{border:0;background:#F2F4F7;border-radius:9px;padding:7px 10px}.field{margin:9px 0}.field label{display:block;font-size:10px;font-weight:800;color:#667085;margin-bottom:4px}.field input,.field textarea,.field select{width:100%}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;border-radius:11px;padding:10px 14px;font-size:10px;opacity:0;pointer-events:none;transition:.2s;z-index:80}.toast.show{opacity:1}.large{font-size:115%}.simple .advanced{display:none!important}.mobilemenu{display:none}@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:760px){.app{display:block;padding:0}.sidebar{position:fixed;left:0;top:0;height:100vh;z-index:60;border-radius:0;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.top{top:0;border-radius:0}.content{padding:10px}.kpis{grid-template-columns:1fr}.actions .pill{display:none}.pagehead{flex-direction:column}.mobilemenu{display:inline-block}.board{grid-template-columns:60px repeat(3,220px)}}
</style></head><body>
<div class="app" id="app"><aside class="sidebar" id="sidebar"><div><div class="brand"><div class="logo">CR</div><div><b>ClubRoster</b><small>Pizzey Park Pilot</small></div></div><div id="nav"></div></div><button class="ask" data-action="ai">Ask Roster AI</button></aside><main class="main"><header class="top"><div style="display:flex;gap:10px;align-items:center"><button class="btn mobilemenu" data-action="menu">Menu</button><div class="crumb"><small><button data-action="home">Pizzey Park Netball Club</button> / <button id="contextCrumb" data-action="season">2026 Winter</button></small><strong><button id="pageCrumb" data-action="current">Dashboard</button></strong></div></div><div class="actions"><span class="pill green">Concept data</span><span class="pill blue">Pilot: Pizzey Park</span><select id="role"></select><button class="btn" data-action="large">Aa</button><button class="btn" data-action="simple">Simple</button></div></header><section class="content" id="content"></section></main></div>
<div class="drawerback" id="back" data-action="close"></div><aside class="drawer" id="drawer"><div class="drawerhead"><b id="drawerTitle">Details</b><button data-action="close">Close</button></div><div id="drawerBody"></div></aside><div class="toast" id="toast"></div>
<script>
const roles={clubAdmin:'Club Administrator',associationAdmin:'Association Administrator',coordinator:'Umpire Coordinator',mentor:'Umpire Coach / Mentor',finance:'Finance / Payments',supervisor:'Game-day Supervisor',adult:'Adult Umpire',junior:'Junior Umpire',guardian:'Parent / Guardian',audit:'Read-only / Audit'};
const pages={dashboard:'Dashboard',fixtures:'Fixtures',umpires:'Umpires',availability:'Availability',roster:'Roster Board',tasks:'Tasks',gameday:'Game Day',payments:'Match Fees',reports:'Reports',notifications:'Notifications',import:'Season Import',rules:'Rules & Supply',coaching:'Coaching & Development',roles:'Roles & Access',junior:'Junior & Guardian',mobile:'Mobile Experience',audit:'Audit Trail',blueprint:'Software Blueprint',playbook:'Playbook',actionplan:'Action Plan'};
const sections=[['NAV',['dashboard','fixtures','umpires','availability','roster']],['OPERATIONS',['tasks','gameday','payments','reports','notifications']],['SETTINGS',['import','rules','coaching','roles','junior','mobile','audit','blueprint','playbook','actionplan']]];
const access={clubAdmin:Object.keys(pages),associationAdmin:['dashboard','fixtures','umpires','availability','roster','tasks','reports','notifications','import','rules','coaching','roles','audit','blueprint','actionplan'],coordinator:['dashboard','fixtures','umpires','availability','roster','tasks','gameday','reports','notifications','import','rules','coaching','junior','mobile','playbook','actionplan'],mentor:['dashboard','umpires','availability','roster','tasks','reports','notifications','coaching','junior','mobile'],finance:['dashboard','payments','reports','audit'],supervisor:['dashboard','roster','tasks','gameday','notifications','mobile'],adult:['dashboard','availability','tasks','mobile','notifications'],junior:['dashboard','availability','tasks','junior','mobile','notifications'],guardian:['dashboard','availability','tasks','junior','notifications'],audit:['dashboard','fixtures','umpires','roster','tasks','payments','reports','audit','blueprint','playbook','actionplan']};
const actionAccess={autoRoster:['clubAdmin','associationAdmin','coordinator'],publish:['clubAdmin','coordinator'],assignUmpire:['clubAdmin','coordinator'],assignCoach:['clubAdmin','coordinator','mentor'],resolveTask:['clubAdmin','associationAdmin','coordinator','mentor','supervisor','finance'],replyTask:['clubAdmin','associationAdmin','coordinator','mentor','supervisor'],approveFee:['clubAdmin','finance'],approveAllFees:['clubAdmin','finance'],reconcileFees:['clubAdmin','finance'],saveAvailability:['clubAdmin','associationAdmin','coordinator','mentor','adult','junior','guardian'],newRequest:['clubAdmin','associationAdmin','coordinator','mentor','adult','junior','guardian'],coachCheckin:['clubAdmin','coordinator','mentor','supervisor']};
let role='clubAdmin',page='dashboard';let state={fixtureFilter:'all',feeApproved:0,availabilitySaved:0};
let fixtures=[{id:'GC-260801',date:'22 Aug',time:'8:00',court:'1',grade:'U12 Div 1',game:'Pizzey 1 v Mudgeeraba 1',ump1:'Ella J',ump2:'Grace T',coach:'Karen W',status:'Ready'},{id:'GC-260802',date:'22 Aug',time:'8:00',court:'2',grade:'U13 Div 2',game:'Southport 2 v Pizzey 4',ump1:'Ruby S',ump2:'Jade M',coach:'Donna R',status:'Ready'},{id:'GC-260803',date:'22 Aug',time:'8:00',court:'3',grade:'U14 Div 1',game:'Pizzey 3 v Runaway Bay',ump1:'Mia P',ump2:'',coach:'',status:'Needs rostering'},{id:'GC-260804',date:'22 Aug',time:'9:20',court:'1',grade:'U11 Development',game:'Pizzey 5 v Coomera 3',ump1:'Ava D',ump2:'Lucy H',coach:'',status:'Coach needed'},{id:'GC-260805',date:'22 Aug',time:'9:20',court:'2',grade:'Premier A',game:'Pizzey A v Palm Beach A',ump1:'Karen W',ump2:'Chloe N',coach:'Not required',status:'Ready'},{id:'GC-260806',date:'22 Aug',time:'10:40',court:'3',grade:'U15 Div 1',game:'Pizzey 2 v Burleigh 2',ump1:'',ump2:'',coach:'Donna R',status:'No umpires'}];
let availability=[{name:'Ella J',role:'Umpire',age:12,sat:'8:00-12:00',sun:'Unavailable',pref:'Early games',status:'Confirmed'},{name:'Ruby S',role:'Umpire',age:15,sat:'8:00-14:00',sun:'10:00-14:00',pref:'Max 3 games',status:'Confirmed'},{name:'Mia P',role:'Umpire',age:17,sat:'8:00-11:00',sun:'Unavailable',pref:'Needs C Badge coaching',status:'Changed'},{name:'Karen W',role:'Coach',age:42,sat:'All day',sun:'All day',pref:'Green / Blue bibs',status:'Confirmed'},{name:'Donna R',role:'Coach',age:51,sat:'8:00-13:00',sun:'Unavailable',pref:'C Badge pathway',status:'Confirmed'},{name:'Helen A',role:'Umpire / Coach',age:67,sat:'9:00-12:00',sun:'Unavailable',pref:'No consecutive >2',status:'Pending'}];
let tasks=[{id:1,type:'Rostering',priority:'High',title:'No umpires allocated',detail:'GC-260806 - U15 Div 1, Court 3 at 10:40 requires two umpires.',from:'System',status:'Open',action:'assignUmpire'},{id:2,type:'Rostering',priority:'High',title:'Second umpire missing',detail:'GC-260803 - U14 Div 1 has Mia P only.',from:'System',status:'Open',action:'assignUmpire'},{id:3,type:'Coaching',priority:'High',title:'Mandatory coach missing',detail:'U11 Development requires 100% coaching coverage.',from:'System',status:'Open',action:'assignCoach'},{id:4,type:'Confirmation',priority:'Medium',title:'Helen has not confirmed availability',detail:'Availability request sent yesterday.',from:'System',status:'Open',action:'replyTask'},{id:5,type:'Umpire request',priority:'Medium',title:'Mia asks for a later game',detail:'Could I move my 8:00 game later? I have school sport until 8:15.',from:'Mia P',status:'Open',action:'replyTask'},{id:6,type:'Coach request',priority:'Medium',title:'Donna requests coaching swap',detail:'Can Karen cover Court 2 at 9:20? I need to leave by 10:00.',from:'Donna R',status:'Open',action:'replyTask'},{id:7,type:'Communication',priority:'Low',title:'Guardian asks where to meet coach',detail:'Ella’s parent asks where the pre-game coaching briefing is held.',from:'Guardian - Ella J',status:'Open',action:'replyTask'}];
let fees=[{id:'MF-1001',date:'22 Aug',person:'Ella J',role:'Umpire',game:'U12 Div 1',qty:2,rate:28,total:56,status:'Ready'},{id:'MF-1002',date:'22 Aug',person:'Grace T',role:'Umpire',game:'U12 Div 1',qty:2,rate:32,total:64,status:'Ready'},{id:'MF-1003',date:'22 Aug',person:'Karen W',role:'Umpire Coach',game:'U12 Div 1',qty:1,rate:45,total:45,status:'Ready'},{id:'MF-1004',date:'22 Aug',person:'Ruby S',role:'Umpire',game:'U13 Div 2',qty:3,rate:30,total:90,status:'Ready'},{id:'MF-1005',date:'22 Aug',person:'Donna R',role:'Umpire Coach',game:'U13 Div 2',qty:2,rate:45,total:90,status:'Review'},{id:'MF-1006',date:'22 Aug',person:'Mia P',role:'Umpire',game:'U14 Div 1',qty:2,rate:34,total:68,status:'Ready'}];
const levels=[['Green Bib','100%','Every eligible game'],['Blue Bib','75%','Cumulative target'],['C Badge','25%','Approximately 1 in 4'],['B Badge','10%','Periodic review']];
function tag(t,c='blue'){return `<span class="tag ${c}">${t}</span>`}function btn(t,a,c=''){return `<button class="btn ${c}" data-action="${a}">${t}</button>`}function head(t,p,a=''){return `<div class="pagehead"><div><h1>${t}</h1><p>${p}</p></div><div class="headactions">${a}</div></div>`}function kpi(v,l,t='',c='blue'){return `<div class="card kpi">${t?tag(t,c):''}<strong>${v}</strong><small>${l}</small></div>`}function table(h,r){return `<div class="tablewrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function taskCard(t){return `<div class="task"><div class="taskicon ${t.priority==='High'?'red':t.priority==='Medium'?'amber':'blue'}">${t.type[0]}</div><div><b>${t.title}</b><p>${t.detail}</p><p><strong>${t.from}</strong> · ${t.type} · ${t.priority}</p></div><button class="btn" data-action="${t.action}" data-id="${t.id}">${t.action==='replyTask'?'Reply':'Action'}</button></div>`}function metric(l,v){return `<div class="metric"><span>${l}</span><div class="bar"><i style="width:${v}%"></i></div><b>${v}%</b></div>`}
function allowed(id){return (access[role]||[]).includes(id)}function canAction(a){return !actionAccess[a]||actionAccess[a].includes(role)}function buildNav(){const n=document.getElementById('nav');n.innerHTML='';sections.forEach(([label,ids])=>{const h=document.createElement('div');h.className='navlabel';h.textContent=label;n.appendChild(h);const box=document.createElement('div');box.className='nav';ids.filter(allowed).forEach(id=>{const b=document.createElement('button');b.dataset.go=id;b.textContent=pages[id];b.className=id===page?'active':'';box.appendChild(b)});n.appendChild(box)});document.getElementById('role').innerHTML=Object.entries(roles).map(([k,v])=>`<option value="${k}" ${k===role?'selected':''}>${v}</option>`).join('')}
function dashboard(){const open=tasks.filter(t=>t.status==='Open').length,missing=fixtures.filter(f=>f.status!=='Ready').length;return head('Saturday control centre','Tasks is the operational inbox for rostering, confirmations and communications.',btn('Open Tasks','tasks','primary'))+`<div class="grid kpis">${kpi(fixtures.length,'Games in demo round')}${kpi(missing,'Games needing action','Rostering','red')}${kpi(open,'Open Tasks','Inbox','amber')}${kpi('$'+fees.reduce((s,f)=>s+f.total,0),'Match fees pending','Round 8','green')}</div><div class="grid two" style="margin-top:12px"><div class="card"><h2>Roster health</h2>${metric('Umpires',82)}${metric('Coaches',75)}${metric('Availability',91)}${metric('Confirmations',84)}</div><div class="card"><h2>Priority Tasks</h2>${tasks.filter(t=>t.status==='Open').slice(0,4).map(taskCard).join('')}</div></div><div class="card" style="margin-top:12px"><h2>Round workflow</h2><div class="flow">${['fixtures','availability','roster','tasks','gameday','payments'].map((id,i)=>`${i?'<span class="arrow">-&gt;</span>':''}<div class="node ${id==='tasks'?'blue':''}" data-go="${id}">${pages[id]}</div>`).join('')}</div></div>`}
function fixturesPage(){const v=fixtures.filter(f=>state.fixtureFilter==='all'||(state.fixtureFilter==='action'&&f.status!=='Ready'));return head('Fixtures','Working dummy fixture register with coverage status and click-through actions.',btn('Season import settings','import'))+`<div class="card"><div class="toolbar"><button class="btn ${state.fixtureFilter==='all'?'primary':''}" data-action="filterAll">All games</button><button class="btn ${state.fixtureFilter==='action'?'primary':''}" data-action="filterAction">Needs action</button>${btn('Add dummy game','addGame')}</div>${table(['ID','Date','Time','Court','Grade','Game','Umpire 1','Umpire 2','Coach','Status','Action'],v.map(f=>[f.id,f.date,f.time,f.court,f.grade,f.game,f.ump1||tag('Missing','red'),f.ump2||tag('Missing','red'),f.coach||tag('Missing','red'),tag(f.status,f.status==='Ready'?'green':'red'),`<button class="btn" data-action="fixtureDetail" data-id="${f.id}">Open</button>`]))}</div>`}
function availabilityPage(){return head('Availability','Working dummy availability for umpires and coaches. Changes create Tasks for roster review.',btn('Submit request','newRequest','primary'))+`<div class="grid kpis">${kpi('6','People in demo')}${kpi('4','Confirmed','Round 8','green')}${kpi('1','Pending','Needs reply','amber')}${kpi(state.availabilitySaved,'Changes saved','This session')}</div><div class="card" style="margin-top:12px">${table(['Person','Role','Age','Saturday','Sunday','Preference','Status','Action'],availability.map((a,i)=>[a.name,a.role,a.age,a.sat,a.sun,a.pref,tag(a.status,a.status==='Confirmed'?'green':a.status==='Pending'?'amber':'blue'),`<button class="btn" data-action="editAvailability" data-id="${i}">Edit</button>`]))}</div>`}
function roster(){return head('Roster Board','Games missing umpires or coaches feed directly into Tasks.',btn('AutoRoster','autoRoster','primary')+btn('Publish','publish'))+`<div class="card"><div class="board"><div></div><div class="court">Court 1</div><div class="court">Court 2</div><div class="court">Court 3</div><div class="time">8:00</div>${fixtures.slice(0,3).map(f=>gameCard(f)).join('')}<div class="time">9:20+</div>${fixtures.slice(3,6).map(f=>gameCard(f)).join('')}</div></div>`}function gameCard(f){return `<div class="game" data-action="fixtureDetail" data-id="${f.id}"><b>${f.grade}</b><small>${f.game}</small><div class="official ${!f.ump1?'empty':''}">${f.ump1||'Umpire 1 missing'}</div><div class="official ${!f.ump2?'empty':''}">${f.ump2||'Umpire 2 missing'}</div><div class="coach ${!f.coach?'empty':''}">${f.coach||'Coach missing'}</div></div>`}
function tasksPage(){const o=tasks.filter(t=>t.status==='Open');return head('Tasks','One inbox for missing umpires/coaches, roster actions, confirmations and unanswered requests.',btn('Create request','newRequest','primary'))+`<div class="grid kpis">${kpi(o.length,'Open Tasks')}${kpi(o.filter(t=>t.type==='Rostering').length,'Rostering')}${kpi(o.filter(t=>/request/.test(t.type)).length,'Umpire / coach requests')}${kpi(o.filter(t=>t.type==='Communication').length,'Communications')}</div><div class="grid two" style="margin-top:12px"><div class="card"><h2>Open Tasks</h2>${o.map(taskCard).join('')||'<p class="sub">No open tasks.</p>'}</div><div class="card"><h2>Task sources</h2><p class="sub">Tasks are created automatically from missing roster coverage, changed availability, unconfirmed appointments and fee exceptions, or manually by umpires, coaches, guardians and admins.</p></div></div>`}
function paymentsPage(){const total=fees.reduce((s,f)=>s+f.total,0),ready=fees.filter(f=>f.status==='Ready').reduce((s,f)=>s+f.total,0),review=fees.filter(f=>f.status==='Review').reduce((s,f)=>s+f.total,0);return head('Match Fees','Working dummy fee ledger for umpires and umpire coaches.',btn('Approve all ready','approveAllFees','primary')+btn('Reconcile','reconcileFees'))+`<div class="grid kpis">${kpi('$'+total,'Total accrued')}${kpi('$'+ready,'Ready to approve','Round 8','green')}${kpi('$'+review,'Needs review','Exception','amber')}${kpi('$'+state.feeApproved,'Approved this session')}</div><div class="card" style="margin-top:12px">${table(['Fee ID','Date','Person','Role','Game','Qty','Rate','Total','Status','Action'],fees.map(f=>[f.id,f.date,f.person,f.role,f.game,f.qty,'$'+f.rate,'$'+f.total,tag(f.status,f.status==='Ready'?'green':f.status==='Approved'?'blue':'amber'),`<button class="btn" data-action="approveFee" data-id="${f.id}">${f.status==='Approved'?'Approved':'Review'}</button>`]))}</div>`}
function importPage(){return head('Season Import','Season Import now lives under Settings, separate from daily operations.')+`<div class="grid two"><div class="card"><h2>Import full season</h2><p class="sub">Upload CSV/Excel, map, validate, detect changes and create game obligations.</p>${btn('Choose dummy file','dummyImport','primary')}</div><div class="card"><h2>Saved mappings</h2>${table(['Association','Mapping','Last used'],[['Gold Coast Netball','GCNA Season v1','15 Aug 2026'],['Queensland Rep','Qld Rep v2','11 Aug 2026']])}</div></div>`}
function coaching(){return head('Coaching & Development','Admin-controlled development levels determine coach allocation targets.')+`<div class="card">${table(['Level','Coaching %','Meaning'],levels.map(x=>[x[0],tag(x[1],x[1]==='100%'?'red':'blue'),x[2]]))}</div>`}
function gameday(){return head('Game Day','Check in umpires and coaches and resolve live Tasks.',btn('Coach check-in','coachCheckin','primary'))+`<div class="card">${table(['Time','Court','Game','Umpire 1','Umpire 2','Coach','Status'],fixtures.slice(0,4).map(f=>[f.time,f.court,f.grade,f.ump1||tag('Missing','red'),f.ump2||tag('Missing','red'),f.coach||tag('Missing','red'),f.status==='Ready'?tag('Ready','green'):tag('Task open','red')]))}</div>`}
function reports(){return head('Reports','Dummy operational reporting across roster coverage, Tasks, coaching and match fees.')+`<div class="grid kpis">${kpi('82%','Umpire coverage')}${kpi('75%','Coach coverage')}${kpi(tasks.filter(t=>t.status==='Open').length,'Open Tasks')}${kpi('$'+fees.reduce((s,f)=>s+f.total,0),'Fees accrued')}</div>`}
function umpiresPage(){return head('Umpires','Demo register includes umpire and coach roles.')+`<div class="card">${table(['Name','Role','Age','Availability','Development'],availability.map(a=>[a.name,a.role,a.age,a.sat,a.pref]))}</div>`}
function simplePage(){return head(pages[page],`Interactive concept screen for ${pages[page]}.`)+`<div class="card"><p class="sub">This module remains connected while deeper flows are refined.</p>${btn('Back to dashboard','dashboard')}</div>`}
function render(){const map={dashboard,fixtures:fixturesPage,availability:availabilityPage,roster,tasks:tasksPage,payments:paymentsPage,import:importPage,coaching,gameday,reports,umpires:umpiresPage};document.getElementById('content').innerHTML=(map[page]||simplePage)();document.getElementById('pageCrumb').textContent=pages[page];buildNav()}
function go(id){if(!allowed(id)){toast('This role cannot access that screen.');return}closeDrawer();page=id;render();window.scrollTo({top:0,behavior:'smooth'})}function openDrawer(t,h){document.getElementById('drawerTitle').textContent=t;document.getElementById('drawerBody').innerHTML=h;document.getElementById('drawer').classList.add('open');document.getElementById('back').classList.add('open')}function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('back').classList.remove('open')}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),2200)}
function openAction(a,el){if(a in pages){go(a);return}if(!canAction(a)){toast('This role is not authorised for that action.');return}const id=el?.dataset?.id;if(a==='home'){go('dashboard');return}if(a==='season'){openDrawer('Season','2026 Winter. Season Import is managed under Settings.');return}if(a==='current'){toast('You are on '+pages[page]);return}if(a==='close'){closeDrawer();return}if(a==='menu'){document.getElementById('sidebar').classList.toggle('open');return}if(a==='large'){document.getElementById('app').classList.toggle('large');return}if(a==='simple'){document.getElementById('app').classList.toggle('simple');return}if(a==='ai'){openDrawer('Roster AI','Ask which games have no umpires, which messages need replies, who is available or which fees need approval.');return}if(a==='filterAll'){state.fixtureFilter='all';render();return}if(a==='filterAction'){state.fixtureFilter='action';render();return}if(a==='fixtureDetail'){const f=fixtures.find(x=>x.id===id);openDrawer('Fixture '+id,`<h3>${f.grade}</h3><p>${f.game}</p>${table(['Time','Court','Umpire 1','Umpire 2','Coach','Status'],[[f.time,f.court,f.ump1||tag('Missing','red'),f.ump2||tag('Missing','red'),f.coach||tag('Missing','red'),f.status]])}<br>${!f.ump1||!f.ump2?btn('Assign umpire','assignUmpire','primary'):''}${!f.coach&&f.grade.includes('Development')?btn('Assign coach','assignCoach'):''}`);return}if(a==='addGame'){fixtures.push({id:'GC-260807',date:'22 Aug',time:'12:00',court:'4',grade:'U13 Div 3',game:'Pizzey 6 v Coomera 5',ump1:'',ump2:'',coach:'',status:'No umpires'});tasks.push({id:tasks.length+1,type:'Rostering',priority:'High',title:'New game requires umpires',detail:'GC-260807 has no umpires allocated.',from:'System',status:'Open',action:'assignUmpire'});toast('Dummy game added and Task created.');render();return}if(a==='editAvailability'){const av=availability[Number(id)];openDrawer('Edit availability',`<div class="field"><label>Saturday</label><input id="avSat" value="${av.sat}"></div><div class="field"><label>Preference / note</label><input id="avPref" value="${av.pref}"></div><button class="btn primary" data-action="saveAvailability" data-id="${id}">Save availability</button>`);return}if(a==='saveAvailability'){const av=availability[Number(id)];av.sat=document.getElementById('avSat').value;av.pref=document.getElementById('avPref').value;av.status='Changed';state.availabilitySaved++;tasks.push({id:tasks.length+1,type:'Availability',priority:'Medium',title:av.name+' changed availability',detail:'Coordinator should review roster impact for '+av.sat+'.',from:av.name,status:'Open',action:'replyTask'});closeDrawer();toast('Availability saved and Task created.');render();return}if(a==='newRequest'){openDrawer('Send request',`<div class="field"><label>Request type</label><select id="rqType"><option>Umpire request</option><option>Coach request</option><option>Availability</option><option>Communication</option></select></div><div class="field"><label>Message</label><textarea id="rqMsg">Can I change my appointment?</textarea></div>${btn('Send request','sendRequest','primary')}`);return}if(a==='sendRequest'){tasks.push({id:tasks.length+1,type:document.getElementById('rqType').value,priority:'Medium',title:'New request from '+roles[role],detail:document.getElementById('rqMsg').value,from:roles[role],status:'Open',action:'replyTask'});closeDrawer();toast('Request sent to Tasks.');if(allowed('tasks'))go('tasks');return}if(a==='replyTask'){const t=tasks.find(x=>String(x.id)===String(id))||tasks.find(x=>x.status==='Open');openDrawer('Reply to Task',`<h3>${t.title}</h3><p>${t.detail}</p><div class="field"><label>Reply</label><textarea>Thanks - we are reviewing this and will update your appointment.</textarea></div><button class="btn primary" data-action="resolveTask" data-id="${t.id}">Send reply & resolve</button>`);return}if(a==='resolveTask'){const t=tasks.find(x=>String(x.id)===String(id));if(t)t.status='Resolved';closeDrawer();toast('Reply sent and Task resolved.');render();return}if(a==='assignUmpire'){openDrawer('Assign umpire',`${table(['Candidate','Available','Level'],[['Olivia B',tag('Yes','green'),'B Badge'],['Helen A',tag('Yes','green'),'Senior'],['Mia P',tag('Limited','amber'),'C Badge']])}${btn('Assign Olivia B','confirmUmpire','primary')}`);return}if(a==='confirmUmpire'){const f=fixtures.find(x=>!x.ump1||!x.ump2);if(f){if(!f.ump1)f.ump1='Olivia B';else f.ump2='Olivia B';f.status=f.ump1&&f.ump2&&(f.coach||!f.grade.includes('Development'))?'Ready':'Needs rostering'}const t=tasks.find(x=>x.type==='Rostering'&&x.status==='Open');if(t)t.status='Resolved';closeDrawer();toast('Umpire allocated and Task updated.');render();return}if(a==='assignCoach'){openDrawer('Assign coach',`${table(['Coach','Availability','Match'],[['Karen W',tag('Available','green'),'Strong'],['Donna R',tag('Available','green'),'Strong'],['Helen A',tag('Limited','amber'),'Eligible']])}${btn('Assign Karen W','confirmCoach','primary')}`);return}if(a==='confirmCoach'){const f=fixtures.find(x=>!x.coach);if(f){f.coach='Karen W';if(f.ump1&&f.ump2)f.status='Ready'}const t=tasks.find(x=>x.type==='Coaching'&&x.status==='Open');if(t)t.status='Resolved';closeDrawer();toast('Coach allocated and Task updated.');render();return}if(a==='autoRoster'){fixtures.forEach(f=>{if(!f.ump1)f.ump1='Olivia B';if(!f.ump2)f.ump2='Helen A';if(!f.coach&&f.grade.includes('Development'))f.coach='Karen W';if(f.ump1&&f.ump2&&(f.coach||!f.grade.includes('Development')))f.status='Ready'});tasks.filter(t=>t.type==='Rostering'||t.type==='Coaching').forEach(t=>t.status='Resolved');toast('AutoRoster filled dummy gaps and cleared related Tasks.');go('roster');return}if(a==='publish'){toast('Roster published. Confirmation Tasks remain open until answered.');return}if(a==='approveFee'){const f=fees.find(x=>x.id===id);if(f&&f.status!=='Approved'){f.status='Approved';state.feeApproved+=f.total}toast('Match fee approved.');render();return}if(a==='approveAllFees'){fees.filter(f=>f.status==='Ready').forEach(f=>{f.status='Approved';state.feeApproved+=f.total});toast('All ready match fees approved.');render();return}if(a==='reconcileFees'){const r=fees.filter(f=>f.status==='Review');openDrawer('Fee reconciliation',r.length?table(['Person','Role','Amount','Issue'],r.map(f=>[f.person,f.role,'$'+f.total,'Coach attendance confirmation required'])):'All match fees reconcile.');return}if(a==='dummyImport'){toast('Dummy season file loaded: 186 games, 4 warnings, 2 changes.');return}if(a==='coachCheckin'){toast('Coach checked in.');return}toast('Concept action completed.')}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}const a=e.target.closest('[data-action]');if(a)openAction(a.dataset.action,a)});document.getElementById('role').addEventListener('change',e=>{role=e.target.value;if(!allowed(page))page='dashboard';render()});buildNav();render();
</script></body></html>
