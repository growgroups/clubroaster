<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClubRoster Concept - Pizzey Park Pilot</title>
<style>
:root{--b:#2855A6;--bd:#214887;--bs:#EEF4FF;--bg:#F3F5F9;--side:#F8FAFD;--ink:#172033;--muted:#667085;--line:#E6EAF0;--green:#157347;--gb:#EAF8F0;--amber:#9A6700;--ab:#FFF7E2;--red:#B42318;--rb:#FDECEC;--purple:#6941C6;--pb:#F2EEFF;--shadow:0 1px 3px #10182814}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex;gap:12px;padding:12px}.sidebar{width:288px;height:calc(100vh - 24px);position:sticky;top:12px;background:var(--side);border-radius:28px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);overflow:auto}.brand{background:#fff;border-radius:18px;padding:10px 12px;display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--b);color:#fff;font-weight:900}.brand small{display:block;color:var(--muted)}.navlabel{font-size:10px;font-weight:800;color:#98A2B3;letter-spacing:.08em;margin:17px 8px 6px}.nav{background:#fff;border-radius:16px;padding:7px}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:9px;color:#667085;font-size:12px}.nav button.active{background:var(--bs);color:var(--b);font-weight:800}.ask{border:0;background:var(--b);color:#fff;border-radius:16px;padding:12px;font-weight:800}.ask:hover{background:var(--bd)}.main{flex:1;min-width:0}.top{position:sticky;top:12px;z-index:20;background:#fff;border-radius:20px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow)}.crumb small{display:block;font-size:11px;color:#98A2B3}.crumb button{border:0;background:transparent;padding:0;color:inherit}.crumb button:hover{color:var(--b);text-decoration:underline}.actions,.headactions,.toolbar,.tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill,.tag{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:800}.green{background:var(--gb);color:var(--green)}.blue{background:var(--bs);color:var(--b)}.amber{background:var(--ab);color:var(--amber)}.red{background:var(--rb);color:var(--red)}.purple{background:var(--pb);color:var(--purple)}select,.btn,input,textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;color:#475467;font-size:11px}.btn{font-weight:800}.btn.primary{background:var(--b);border-color:var(--b);color:#fff}.btn.danger{background:var(--rb);color:var(--red);border-color:#F3B9B4}.btn[disabled]{opacity:.45;cursor:not-allowed}.content{padding:12px 0 30px}.pagehead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin:8px 2px 14px}.pagehead h1{font-size:24px;margin:0 0 5px}.pagehead p{margin:0;color:var(--muted);font-size:12px;max-width:960px}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:1.35fr 1fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}.card h2,.card h3{margin:0 0 6px}.sub{font-size:10px;color:var(--muted);margin:0 0 12px}.kpi strong{display:block;font-size:28px;margin:9px 0 2px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:9px 10px;border-bottom:1px solid #EEF1F4;text-align:left;font-size:10px;white-space:nowrap;vertical-align:top}th{background:#F8FAFC;color:#667085;text-transform:uppercase;font-size:9px}.task{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px;margin:7px 0}.taskicon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:900;flex:none}.task .grow{flex:1}.task b{font-size:10px}.task p{font-size:9px;color:var(--muted);margin:3px 0}.timeline{border-left:2px solid #DCE7FB;padding-left:12px}.event{padding:0 0 13px}.event b{font-size:10px}.event p{font-size:9px;color:var(--muted);margin:3px 0}.profile{display:grid;grid-template-columns:190px 1fr;gap:12px}.profileAside{background:#F8FAFC;border-radius:14px;padding:12px}.profileAside strong{font-size:18px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:10px}.tabs button.active{background:var(--bs);color:var(--b);font-weight:800}.board{display:grid;grid-template-columns:72px repeat(3,minmax(230px,1fr));gap:7px;overflow:auto}.court,.time,.game{border:1px solid var(--line);border-radius:11px;padding:9px}.court,.time{background:#F8FAFC;text-align:center;font-size:10px;font-weight:800}.game{min-height:150px}.game b{font-size:10px}.game small{display:block;color:var(--muted);margin:3px 0 7px}.official{background:#F8FAFC;border-radius:7px;padding:6px;margin:4px 0;font-size:9px}.coach{background:var(--pb);color:var(--purple);border-radius:7px;padding:6px;margin:5px 0;font-size:9px;font-weight:700}.empty{background:#FFF7F7!important;color:var(--red)!important;border:1px dashed #F3B9B4}.notice{background:var(--ab);border:1px solid #F3DE9B;border-radius:10px;padding:10px;font-size:10px;color:#7A5B00}.success{background:var(--gb);border:1px solid #B8E2C8;border-radius:10px;padding:10px;font-size:10px;color:var(--green)}.flow{display:flex;gap:7px;align-items:center;overflow:auto}.node{min-width:125px;border:1px solid var(--line);border-radius:11px;padding:11px;text-align:center;font-size:9px;font-weight:800;background:#fff}.node.click{cursor:pointer}.arrow{color:#98A2B3}.checkrow{display:flex;gap:9px;align-items:flex-start;border-bottom:1px solid #EEF1F4;padding:9px 0}.checkrow input{margin-top:2px}.progress{height:8px;background:#EEF1F5;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:var(--b)}.drawerback{position:fixed;inset:0;background:#10182855;display:none;z-index:50}.drawerback.open{display:block}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(780px,96vw);background:#fff;z-index:51;transform:translateX(100%);transition:.2s;box-shadow:-10px 0 35px #10182822;padding:18px;overflow:auto}.drawer.open{transform:translateX(0)}.drawerhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.drawerhead button{border:0;background:#F2F4F7;border-radius:9px;padding:7px 10px}.field{margin:9px 0}.field label{display:block;font-size:10px;font-weight:800;color:#667085;margin-bottom:4px}.field input,.field textarea,.field select{width:100%}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;border-radius:11px;padding:10px 14px;font-size:10px;opacity:0;pointer-events:none;transition:.2s;z-index:80}.toast.show{opacity:1}.large{font-size:115%}.simple .advanced{display:none!important}.mobilemenu{display:none}@media(max-width:1050px){.kpis,.three,.four{grid-template-columns:repeat(2,1fr)}.two,.profile{grid-template-columns:1fr}}@media(max-width:760px){.app{display:block;padding:0}.sidebar{position:fixed;left:0;top:0;height:100vh;z-index:60;border-radius:0;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.top{top:0;border-radius:0}.content{padding:10px}.kpis,.three,.four{grid-template-columns:1fr}.actions .pill{display:none}.pagehead{flex-direction:column}.mobilemenu{display:inline-block}.board{grid-template-columns:60px repeat(3,220px)}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div><div class="brand"><div class="logo">CR</div><div><b>ClubRoster</b><small>Pizzey Park Pilot</small></div></div><div id="nav"></div></div>
    <button class="ask" data-action="ai">Ask Roster AI</button>
  </aside>
  <main class="main">
    <header class="top">
      <div style="display:flex;gap:10px;align-items:center"><button class="btn mobilemenu" data-action="menu">Menu</button><div class="crumb"><small><button data-action="home">Pizzey Park Netball Club</button> / <button data-action="season">2026 Winter</button></small><strong><button id="pageCrumb" data-action="current">Dashboard</button></strong></div></div>
      <div class="actions"><span class="pill green">Synthetic concept data</span><span class="pill blue">Pilot: Pizzey Park</span><select id="role"></select><button class="btn" data-action="large">Aa</button><button class="btn" data-action="simple">Simple</button></div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>
<div class="drawerback" id="back" data-action="close"></div>
<aside class="drawer" id="drawer"><div class="drawerhead"><b id="drawerTitle">Details</b><button data-action="close">Close</button></div><div id="drawerBody"></div></aside>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
<script src="patch.js"></script>
<script src="mobile-app.js"></script>
<script src="game-day-checklist.js"></script>
</body>
</html>
