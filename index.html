function tag(t,c='blue'){return `<span class="tag ${c}">${t}</span>`}function btn(t,a,c=''){return `<button class="btn ${c}" data-action="${a}">${t}</button>`}function head(t,p,a=''){return `<div class="pagehead"><div><h1>${t}</h1><p>${p}</p></div><div class="headactions">${a}</div></div>`}function kpi(v,l,t='',c='blue'){return `<div class="card kpi">${t?tag(t,c):''}<strong>${v}</strong><small>${l}</small></div>`}function table(h,r){return `<div class="tablewrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function taskCard(t){return `<div class="task"><div class="taskicon ${t.priority==='High'?'red':t.priority==='Medium'?'amber':'blue'}">${t.type[0]}</div><div><b>${t.title}</b><p>${t.detail}</p><p><strong>${t.from}</strong> · ${t.type} · ${t.priority}</p></div><button class="btn" data-action="${t.action}" data-id="${t.id}" data-person="${t.person||''}">Open</button></div>`}
function allowed(id){return (access[role]||[]).includes(id)}function canAction(a){return !actionAccess[a]||actionAccess[a].includes(role)}function buildNav(){const n=document.getElementById('nav');n.innerHTML='';sections.forEach(([label,ids])=>{const h=document.createElement('div');h.className='navlabel';h.textContent=label;n.appendChild(h);const box=document.createElement('div');box.className='nav';ids.filter(allowed).forEach(id=>{const b=document.createElement('button');b.dataset.go=id;b.textContent=pages[id];b.className=id===page?'active':'';box.appendChild(b)});n.appendChild(box)});document.getElementById('role').innerHTML=Object.entries(roles).map(([k,v])=>`<option value="${k}" ${k===role?'selected':''}>${v}</option>`).join('')}
function dashboard(){const outstanding=payments.filter(p=>p.status!=='Paid').reduce((s,p)=>s+p.amount,0);return head('Saturday control centre','Operational overview across rostering, compliance, communications and finance.',btn('Open Tasks','tasks','primary')+btn('Open Finance','finance'))+`<div class="grid kpis">${kpi('3','Games needing action','Rostering','red')}${kpi(tasks.filter(t=>t.status==='Open').length,'Open Tasks','Inbox','amber')}${kpi('$'+outstanding,'Outstanding payments','Round 8','green')}${kpi(batch.approval1&&batch.approval2?'2 / 2':'0 / 2','Payment approvals','Maker-checker','blue')}</div><div class="grid two" style="margin-top:12px"><div class="card"><h2>Priority Tasks</h2>${tasks.filter(t=>t.status==='Open').map(taskCard).join('')}</div><div class="card"><h2>Compliance watch</h2><p class="sub">1 open junior safeguarding incident. Restricted incident records are accessible only to authorised roles.</p>${btn('Open Ella profile','openElla','primary')}</div></div>`}

function umpiresPage(){return head('Umpire register','Open any umpire or coach to see registrations, coaching feedback, communications, incidents/conflicts, payments and a complete audit trail.')+`<div class="grid kpis">${kpi(people.length,'Registered people')}${kpi(people.filter(p=>p.age<18).length,'Junior umpires','Guardian linked','blue')}${kpi(people.reduce((s,p)=>s+p.incidents.filter(i=>/Open/.test(i[6])).length,0),'Open compliance matters','Restricted','red')}${kpi('$'+people.reduce((s,p)=>s+p.payments.filter(x=>x[4]!=='Paid').reduce((z,x)=>z+Number(x[3].replace('$','')),0),0),'Outstanding payments')}</div><div class="card" style="margin-top:12px">${table(['Name','Role','Age','Level','Registration','Conflict','Outstanding','Action'],people.map(p=>[p.name,p.role,p.age,p.level,tag('Active','green'),p.conflicts,p.payments.find(x=>x[4]!=='Paid')?.[3]||'$0',`<button class="btn" data-action="openUmpire" data-person="${p.id}">Open profile</button>`]))}</div>`}

function financePage(){const included=payments.filter(p=>!p.status.includes('Review')),total=included.reduce((s,p)=>s+p.amount,0),hold=payments.filter(p=>p.status.includes('Review')).reduce((s,p)=>s+p.amount,0),ready=batch.approval1&&batch.approval2;return head('Finance','Track umpire and coach payments, independent approvals, bank export, Xero export and payment completion.',btn('Match fee detail','payments'))+`<div class="grid kpis">${kpi('$'+total,'Batch total')}${kpi('$'+hold,'On hold / review','Exception','amber')}${kpi(batch.approval1?1:0,'Approval 1')}${kpi(batch.approval2?1:0,'Approval 2')}</div><div class="grid two" style="margin-top:12px"><div class="card"><h2>Payment batch ${batch.id}</h2><p class="sub">Two distinct people must approve before exports become available.</p>${table(['Person','Role','Games','Amount','Status'],payments.map(p=>[p.person,p.role,p.games,'$'+p.amount,tag(p.status,p.status.includes('Review')?'amber':p.status==='Paid'?'green':'blue')]))}</div><div class="card"><h2>Approval & export</h2><p>${batch.approval1?tag('Approval 1: '+batch.approval1,'green'):tag('Approval 1 required','amber')}</p><p>${batch.approval2?tag('Approval 2: '+batch.approval2,'green'):tag('Approval 2 required','amber')}</p>${btn('Approve as Finance Manager','approve1','primary')} ${btn('Approve as Partner','approve2')}<hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><button class="btn ${ready?'primary':''}" data-action="downloadBank" ${ready?'':'disabled'}>Download bank CSV</button> <button class="btn" data-action="downloadXero" ${ready?'':'disabled'}>Download Xero CSV</button><div class="notice" style="margin-top:10px">Concept exports are mapping-ready demo CSV files only. Final production columns must be confirmed against the selected bank upload specification and current Xero import workflow.</div>${ready?'<br>'+btn('Mark batch paid','markPaid'):''}</div></div><div class="card" style="margin-top:12px"><h2>Finance audit trail</h2>${auditTimeline function paymentsPage(){return head('Match Fees','Detailed dummy entitlement ledger feeding the Finance payment batch.')+`<div class="card">${table(['Payment','Person','Role','Games','Amount','Status'],payments.map(p=>[p.id,p.person,p.role,p.games,'$'+p.amount,tag(p.status,p.status.includes('Review')?'amber':p.status==='Paid'?'green':'blue')]))}</div>`}
function reports(){return head('Reports','Operational reporting across compliance, payments and rostering.')+`<div class="grid kpis">${kpi('1','Open compliance matter')}${kpi('$349','Round 8 payable')}${kpi('$90','On hold')}${kpi('2','Approvals required')}</div>`}
function simplePage(){return head(pages[page],`Interactive concept screen for ${pages[page]}.`)+`<div class="card"><p class="sub">This module remains connected to the prototype.</p>${btn('Back to dashboard','dashboard')}</div>`}
function profileHTML(p){const openInc=p.incidents.filter(i=>/Open/.test(i[6])).length;const paid=p.payments.filter(x=>x[4]==='Paid').reduce((s,x)=>s+Number(x[3].replace('$','')),0),out=p.payments.filter(x=>x[4]!=='Paid').reduce((s,x)=>s+Number(x[3].replace('$','')),0);return `<div class="profile"><div class="profileAside"><strong>${p.name}</strong><p class="sub">${p.role} · Age ${p.age}</p>${tag(p.level,'blue')}<p><b>Guardian</b><br><span class="sub">${p.guardian}</span></p><p><b>Availability</b><br><span class="sub">${p.availability}</span></p><p><b>Conflict flags</b><br><span class="sub">${p.conflicts}</span></p><p>${openInc?tag(openInc+' open compliance matter','red'):tag('No open compliance matters','green')}</p></div><div><div class="tabs">${['summary','registrations','coaching','communications','incidents','payments','audit'].map(t=>`<button class="${profileTab===t?'active':''}" data-action="profileTab" data-tab="${t}" data-person="${p.id}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>${profileTabContent(p,paid,out)}</div></div>`}
function profileTabContent(p,paid,out){if(profileTab==='summary')return `<div class="grid three">${kpi(p.registrations.length,'Registrations')}${kpi(p.coachComments.length,'Coach comments')}${kpi(p.incidents.length,'Recorded matters',p.incidents.length?'Managed record':'None',p.incidents.length?'amber':'green')}</div><div class="card" style="margin-top:12px"><h3>Current compliance summary</h3><p class="sub">Registration active. Guardian linkage and conflict flags shown above. Restricted incidents are kept separate from coaching feedback.</p></div>`;if(profileTab==='registrations')return table(['Year','Registration / accreditation','Status','Expiry'],p.registrations);if(profileTab==='coaching')return `<div class="timeline">${p.coachComments.map(c=>`<div class="event"><b>${c[0]} · ${c[1]}</b><p>${c[2]} · ${c[3]}</p></div>`).join('')||'<p class="sub">No coach comments recorded.</p>'}</div>`;if(profileTab==='communications')return table(['Date/time','From / to','Communication','Status'],p.communications);if(profileTab==='incidents')return `${btn('Record new incident / issue','newIncident','primary')}<br><br>${p.incidents.length?table(['Date','Category','Game / court','Description','Immediate action','Owner','Status'],p.incidents):'<p class="sub">No incidents recorded.</p>'}<div class="notice" style="margin-top:10px">Sensitive safeguarding, abuse, behavioural and complaint records are restricted compliance records, not public roster notes.</div>`;if(profileTab==='payments')return `<div class="grid two">${kpi('$'+paid,'Paid')}${kpi('$'+out,'Outstanding')}</div><div style="margin-top:12px">${table(['Date','Round','Role','Amount','Status'],p.payments)}</div>`;return auditTimeline(p)}
function auditTimeline(p){const events=p?[['15 Aug 2026 6:10pm','Guardian message received','Communication recorded against '+p.name],['15 Aug 2026 6:14pm','Coordinator opened profile','Compliance profile access logged'],['10 Aug 2026 3:45pm','Incident recorded','Restricted incident record created'],['8 Aug 2026 5:20pm','Payment marked paid','Round 7 payment completed']]:[['16 Aug 2026 8:55am','Batch created','PAY-R08-001 created from approved match fees'],['16 Aug 2026 8:56am','Review hold','Donna R payment held pending attendance check'],['16 Aug 2026 8:58am','Finance viewed batch','Payment batch opened for approval']];return `<div class="timeline">${events.map(e=>`<div class="event"><b>${e[0]} · ${e[1]}</b><p>${e[2]}</p></div>`).join('')}</div>`}
function render(){const map={dashboard,fixtures:fixturesPage,availability:availabilityPage,umpires:umpiresPage,tasks:tasksPage,finance:financePage,payments:paymentsPage,reports};document.getElementById('content').innerHTML=(map[page]||simplePage)();document.getElementById('pageCrumb').textContent=pages[page];buildNav()}
function go(id){if(!allowed(id)){toast('This role cannot access that screen.');return}closeDrawer();page=id;render();window.scrollTo({top:0,behavior:'smooth'})}function openDrawer(t,h){document.getElementById('drawerTitle').textContent=t;document.getElementById('drawerBody').innerHTML=h;document.getElementById('drawer').classList.add('open');document.getElementById('back').classList.add('open')}function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('back').classList.remove('open')}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),2200)}function downloadCsv(name,rows){const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function openPerson(id){const p=people.find(x=>x.id===id);if(!p)return;openDrawer('Umpire profile · '+p.name,profileHTML(p))}
function openAction(a,el){if(a in pages){go(a);return}if(!canAction(a)){toast('This role is not authorised for that action.');return}const id=el?.dataset?.id,person=el?.dataset?.person;if(a==='home'){go('dashboard');return}if(a==='season'){openDrawer('Season','2026 Winter. Season Import is managed under Settings.');return}if(a==='current'){toast('You are on '+pages[page]);return}if(a==='close'){closeDrawer();return}if(a==='menu'){document.getElementById('sidebar').classList.toggle('open');return}if(a==='large'){document.getElementById('app').classList.toggle('large');return}if(a==='simple'){document.getElementById('app').classList.toggle('simple');return}if(a==='ai'){openDrawer('Roster AI','Ask about unresolved Tasks, umpire compliance records, registration gaps or payments awaiting approval.');return}if(a==='openElla'){profileTab='summary';openPerson('U001');return}if(a==='openUmpire'){profileTab='summary';openPerson(person||'U001');return}if(a==='profileTab'){profileTab=el.dataset.tab;openPerson(person);return}if(a==='newIncident'){openDrawer('Record incident / issue',`<div class="field"><label>Person</label><select id="incPerson">${people.map(p=>`<option value="${p.id}" ${person===p.id?'selected':''}>${p.name}</option>`).join('')}</select></div><div class="field"><label>Category</label><select id="incCat"><option>Parent / spectator abuse</option><option>Conflict / complaint</option><option>Safety concern</option><option>Behavioural issue</option><option>Other compliance matter</option></select></div><div class="field"><label>Game / court</label><input id="incGame" value="GC-260801 · Court 1"></div><div class="field"><label>Description</label><textarea id="incDesc">Parent approached and verbally abused umpire after match.</textarea></div><div class="field"><label>Immediate action</label><textarea id="incAction">Supervisor intervened, separated parties and notified coordinator.</textarea></div>${btn('Save restricted record','saveIncident','primary')}`);return}if(a==='saveIncident'){const p=people.find(x=>x.id===document.getElementById('incPerson').value);p.incidents.push(['16 Aug 2026',document.getElementById('incCat').value,document.getElementById('incGame').value,document.getElementById('incDesc').value,document.getElementById('incAction').value,'Umpire Coordinator','Open - follow-up']);tasks.push({id:tasks.length+1,type:'Compliance',priority:'High',title:'Compliance follow-up required',detail:p.name+' has a newly recorded incident requiring review.',from:'System',status:'Open',action:'openUmpire',person:p.id});profileTab='incidents';openPerson(p.id);toast('Restricted incident saved and Task created.');return}if(a==='editAvailability'){const row=availability[Number(id)];openDrawer('Edit availability',`<div class="field"><label>Saturday</label><input id="avSat" value="${row[3]}"></div><div class="field"><label>Preference</label><input id="avPref" value="${row[4]}"></div><button class="btn primary" data-action="saveAvailability" data-id="${id}">Save availability</button>`);return}if(a==='saveAvailability'){availability[Number(id)][3]=document.getElementById('avSat').value;availability[Number(id)][4]=document.getElementById('avPref').value;closeDrawer();toast('Availability updated.');render();return}if(a==='newRequest'){openDrawer('Send request',`<div class="field"><label>Message</label><textarea id="rqMsg">Can I change my appointment?</textarea></div>${btn('Send request','sendRequest','primary')}`);return}if(a==='sendRequest'){tasks.push({id:tasks.length+1,type:'Communication',priority:'Medium',title:'New request from '+roles[role],detail:document.getElementById('rqMsg').value,from:roles[role],status:'Open',action:'replyTask'});closeDrawer();toast('Request sent to Tasks.');return}if(a==='replyTask'){openDrawer('Reply to Task',`<div class="field"><label>Reply</label><textarea>Thanks - we are reviewing this and will respond shortly.</textarea></div><button class="btn primary" data-action="resolveTask" data-id="${id}">Send reply & resolve</button>`);return}if(a==='resolveTask'){const t=tasks.find(x=>String(x.id)===String(id));if(t)t.status='Resolved';closeDrawer();toast('Task resolved and communication logged.');render();return}if(a==='approve1'){batch.approval1='Finance Manager · 16 Aug 2026 9:03am';batch.status='Awaiting approval 2';payments.filter(p=>p.status==='Awaiting approval 1').forEach(p=>p.status='Awaiting approval 2');toast('Approval 1 recorded. A different approver is still required.');render();return}if(a==='approve2'){if(!batch.approval1){toast('Approval 1 must be completed first.');return}batch.approval2='Partner · 16 Aug 2026 9:04am';batch.status='Approved for payment';payments.filter(p=>p.status==='Awaiting approval 2').forEach(p=>p.status='Approved for payment');toast('Second independent approval recorded. Exports unlocked.');render();return}if(a==='downloadBank'){if(!(batch.approval1&&batch.approval2)){toast('Two approvals required before export.');return}downloadCsv('clubroster-bank-payment-demo.csv',[['BatchID','Payee','Reference','Amount','Status'],...payments.filter(p=>p.status==='Approved for payment').map(p=>[batch.id,p.person,p.id,p.amount,'Approved'])]);batch.exported=true;toast('Concept bank CSV downloaded.');return}if(a==='downloadXero'){if(!(batch.approval1&&batch.approval2)){toast('Two approvals required before export.');return}downloadCsv('clubroster-xero-import-demo.csv',[['Date','Payee','Description','Reference','Amount','Tracking'],...payments.filter(p=>p.status==='Approved for payment').map(p=>['22/08/2026',p.person,p.role+' match fees',p.id,p.amount,'Umpiring'])]);toast('Concept Xero CSV downloaded.');return}if(a==='markPaid'){if(!(batch.approval1&&batch.approval2)){toast('Two approvals required.');return}batch.paid=true;batch.status='Paid';payments.filter(p=>p.status==='Approved for payment').forEach(p=>p.status='Paid');people.forEach(p=>p.payments.forEach(x=>{if(x[4]==='Awaiting approval')x[4]='Paid'}));toast('Batch marked paid and umpire profiles updated.');render();return}toast('Concept action completed.')}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}const a=e.target.closest('[data-action]');if(a)openAction(a.dataset.action,a)});document.getElementById('role').addEventListener('change',e=>{role=e.target.value;if(!allowed(page))page='dashboard';render()});buildNav();render();
</script></body></html>
