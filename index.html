<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClubRoster Concept - Pizzey Park Pilot</title>
<style>
:root{--b:#2855A6;--bs:#EEF4FF;--bg:#F3F5F9;--side:#F8FAFD;--ink:#172033;--muted:#667085;--line:#E6EAF0;--green:#157347;--gb:#EAF8F0;--amber:#9A6700;--ab:#FFF7E2;--red:#B42318;--rb:#FDECEC;--purple:#6941C6;--pb:#F2EEFF;--shadow:0 1px 3px #10182814}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex;gap:12px;padding:12px}.sidebar{width:288px;height:calc(100vh - 24px);position:sticky;top:12px;background:var(--side);border-radius:28px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);overflow:auto}.brand{background:#fff;border-radius:18px;padding:10px 12px;display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--b);color:#fff;font-weight:900}.brand small{display:block;color:var(--muted)}.navlabel{font-size:10px;font-weight:800;color:#98A2B3;letter-spacing:.08em;margin:17px 8px 6px}.nav{background:#fff;border-radius:16px;padding:7px}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:9px;color:#667085;font-size:12px}.nav button.active{background:var(--bs);color:var(--b);font-weight:800}.ask{border:0;background:var(--b);color:#fff;border-radius:16px;padding:12px;font-weight:800}.main{flex:1;min-width:0}.top{position:sticky;top:12px;z-index:20;background:#fff;border-radius:20px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow)}.crumb small{display:block;font-size:11px;color:#98A2B3}.crumb button{border:0;background:transparent;padding:0;color:inherit}.crumb button:hover{color:var(--b);text-decoration:underline}.actions{display:flex;gap:8px;align-items:center}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:10px;font-weight:800}.green{background:var(--gb);color:var(--green)}.blue{background:var(--bs);color:var(--b)}.amber{background:var(--ab);color:var(--amber)}.red{background:var(--rb);color:var(--red)}.purple{background:var(--pb);color:var(--purple)}select,.btn,input,textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;color:#475467;font-size:11px}.btn{font-weight:800}.btn.primary{background:var(--b);border-color:var(--b);color:#fff}.content{padding:12px 0 30px}.pagehead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin:8px 2px 14px}.pagehead h1{font-size:24px;margin:0 0 5px}.pagehead p{margin:0;color:var(--muted);font-size:12px;max-width:900px}.headactions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:1.4fr 1fr}.card{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}.card h2,.card h3{margin:0 0 6px}.sub{font-size:10px;color:var(--muted);margin-bottom:12px}.kpi strong{display:block;font-size:28px;margin:9px 0 2px}.tag{display:inline-flex;border-radius:999px;padding:4px 7px;font-size:9px;font-weight:800}.metric{display:grid;grid-template-columns:115px 1fr 48px;gap:8px;align-items:center;font-size:10px;margin:8px 0}.bar{height:7px;border-radius:99px;background:#EEF1F5;overflow:hidden}.bar i{display:block;height:100%;background:var(--b)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:9px 10px;border-bottom:1px solid #EEF1F4;text-align:left;font-size:10px;white-space:nowrap}th{background:#F8FAFC;color:#667085;text-transform:uppercase;font-size:9px}.exception{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px;margin:7px 0}.exicon{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;background:var(--bs);color:var(--b);font-weight:900;flex:none}.exception b{font-size:10px}.exception p{font-size:9px;color:var(--muted);margin:3px 0}.exception button{margin-left:auto}.flow{display:flex;gap:7px;align-items:center;overflow:auto}.node{min-width:120px;border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center;font-size:9px;font-weight:800;cursor:pointer}.node.blue{background:var(--bs);color:var(--b)}.arrow{color:#98A2B3}.board{display:grid;grid-template-columns:70px repeat(3,minmax(235px,1fr));gap:7px;overflow:auto}.court,.time,.game{border:1px solid var(--line);border-radius:11px;padding:9px}.court,.time{background:#F8FAFC;text-align:center;font-size:10px;font-weight:800}.game{min-height:145px;cursor:pointer}.game b{font-size:10px}.game small{display:block;color:var(--muted);margin:3px 0 7px}.official{background:#F8FAFC;border-radius:7px;padding:5px;margin:4px 0;font-size:9px}.coach{background:var(--pb);color:var(--purple);border-radius:7px;padding:6px;margin:5px 0;font-size:9px;font-weight:700}.empty{background:#FFF7F7!important;color:var(--red)!important;border:1px dashed #F3B9B4}.drawerback{position:fixed;inset:0;background:#10182855;display:none;z-index:50}.drawerback.open{display:block}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(480px,94vw);background:#fff;z-index:51;transform:translateX(100%);transition:.2s;box-shadow:-10px 0 35px #10182822;padding:18px;overflow:auto}.drawer.open{transform:translateX(0)}.drawerhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.drawerhead button{border:0;background:#F2F4F7;border-radius:9px;padding:7px 10px}.field{margin:9px 0}.field label{display:block;font-size:10px;font-weight:800;color:#667085;margin-bottom:4px}.field input,.field textarea,.field select{width:100%}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;border-radius:11px;padding:10px 14px;font-size:10px;opacity:0;pointer-events:none;transition:.2s;z-index:80}.toast.show{opacity:1}.large{font-size:115%}.simple .advanced{display:none!important}.mobilemenu{display:none}@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:760px){.app{display:block;padding:0}.sidebar{position:fixed;left:0;top:0;height:100vh;z-index:60;border-radius:0;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.top{top:0;border-radius:0}.content{padding:10px}.kpis{grid-template-columns:1fr}.actions .pill{display:none}.pagehead{flex-direction:column}.mobilemenu{display:inline-block}.board{grid-template-columns:60px repeat(3,220px)}}
</style>
</head>
<body>
<div class="app" id="app"><aside class="sidebar" id="sidebar"><div><div class="brand"><div class="logo">CR</div><div><b>ClubRoster</b><small>Pizzey Park Pilot</small></div></div><div id="nav"></div></div><button class="ask" data-action="ai">Ask Roster AI</button></aside><main class="main"><header class="top"><div style="display:flex;gap:10px;align-items:center"><button class="btn mobilemenu" data-action="menu">Menu</button><div class="crumb"><small><button data-action="home">Pizzey Park Netball Club</button> / <button id="contextCrumb" data-action="season">2026 Winter</button></small><strong><button id="pageCrumb" data-action="current">Dashboard</button></strong></div></div><div class="actions"><span class="pill green">Concept data</span><span class="pill blue">Pilot: Pizzey Park</span><select id="role"></select><button class="btn" data-action="large">Aa</button><button class="btn" data-action="simple">Simple</button></div></header><section class="content" id="content"></section></main></div>
<div class="drawerback" id="back" data-action="close"></div><aside class="drawer" id="drawer"><div class="drawerhead"><b id="drawerTitle">Details</b><button data-action="close">Close</button></div><div id="drawerBody"></div></aside><div class="toast" id="toast"></div>
<script>
const roles={clubAdmin:'Club Administrator',associationAdmin:'Association Administrator',coordinator:'Umpire Coordinator',mentor:'Umpire Coach / Mentor',finance:'Finance / Payments',supervisor:'Game-day Supervisor',adult:'Adult Umpire',junior:'Junior Umpire',guardian:'Parent / Guardian',audit:'Read-only / Audit'};
const pages={dashboard:'Dashboard',import:'Season Import',fixtures:'Fixtures',umpires:'Umpires',availability:'Availability',roster:'Roster Board',exceptions:'Exceptions',gameday:'Game Day',payments:'Match Fees',reports:'Reports',notifications:'Notifications',rules:'Rules & Supply',coaching:'Coaching & Development',roles:'Roles & Access',junior:'Junior & Guardian',mobile:'Mobile Experience',audit:'Audit Trail',blueprint:'Software Blueprint',playbook:'Playbook',actionplan:'Action Plan'};
const sections=[['NAV',['dashboard','import','fixtures','umpires','availability','roster']],['OPERATIONS',['exceptions','gameday','payments','reports','notifications']],['SETTINGS',['rules','coaching','roles','junior','mobile','audit','blueprint','playbook','actionplan']]];
const access={clubAdmin:Object.keys(pages),associationAdmin:['dashboard','import','fixtures','umpires','availability','roster','exceptions','reports','notifications','rules','coaching','roles','audit','blueprint','actionplan'],coordinator:['dashboard','fixtures','umpires','availability','roster','exceptions','gameday','reports','notifications','rules','coaching','junior','mobile','playbook','actionplan'],mentor:['dashboard','umpires','availability','roster','reports','notifications','coaching','junior','mobile'],finance:['dashboard','payments','reports','audit'],supervisor:['dashboard','roster','exceptions','gameday','notifications','mobile'],adult:['dashboard','availability','mobile','notifications'],junior:['dashboard','availability','junior','mobile','notifications'],guardian:['dashboard','availability','junior','notifications'],audit:['dashboard','fixtures','umpires','roster','payments','reports','audit','blueprint','playbook','actionplan']};
const actionAccess={autoRoster:['clubAdmin','associationAdmin','coordinator'],publish:['clubAdmin','coordinator'],addLevel:['clubAdmin','associationAdmin','coordinator'],editLevel:['clubAdmin','associationAdmin','coordinator'],addCoachRule:['clubAdmin','associationAdmin','coordinator'],assignCoach:['clubAdmin','coordinator','mentor'],coachCheckin:['clubAdmin','coordinator','mentor','supervisor'],approve:['clubAdmin','finance'],broadcast:['clubAdmin','associationAdmin','coordinator']};
let role='clubAdmin',page='dashboard';let state={published:false,coachCheckedIn:false};
let levels=[{name:'Green Bib',type:'Bib colour',coverage:100,coaching:'Continuous sideline coaching',coachLevel:'Accredited Coach',review:'Round'},{name:'Blue Bib',type:'Bib colour',coverage:75,coaching:'Pre-game + halftime + post-game',coachLevel:'Accredited Coach',review:'4 games'},{name:'C Badge',type:'Badge',coverage:25,coaching:'Targeted observation and feedback',coachLevel:'Senior Umpire Coach',review:'4 games'},{name:'B Badge',type:'Badge',coverage:10,coaching:'Development review',coachLevel:'Senior Umpire Coach',review:'10 games'}];
let coachRules=[{name:'U11 Development',match:'U11 / Development divisions',coverage:100,reason:'Game requires active development coach'},{name:'C Badge pathway',match:'Any game with C Badge umpire',coverage:25,reason:'Individual development target'}];
const umpires=[{name:'Ella J',age:12,level:'Green Bib',eligible:8,coached:6,target:8},{name:'Ruby S',age:15,level:'Blue Bib',eligible:8,coached:5,target:6},{name:'Mia P',age:17,level:'C Badge',eligible:12,coached:2,target:3},{name:'Karen W',age:42,level:'B Badge',eligible:20,coached:2,target:2}];
function tag(t,c='blue'){return `<span class="tag ${c}">${t}</span>`}function btn(t,a,c=''){return `<button class="btn ${c}" data-action="${a}">${t}</button>`}function head(t,p,a=''){return `<div class="pagehead"><div><h1>${t}</h1><p>${p}</p></div><div class="headactions">${a}</div></div>`}function kpi(v,l,t='',c='blue'){return `<div class="card kpi">${t?tag(t,c):''}<strong>${v}</strong><small>${l}</small></div>`}function table(h,rows){return `<div class="tablewrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function ex(i,t,p,a='',c='blue'){return `<div class="exception"><div class="exicon ${c}">${i}</div><div><b>${t}</b><p>${p}</p></div>${a}</div>`}function metric(l,v){return `<div class="metric"><span>${l}</span><div class="bar"><i style="width:${v}%"></i></div><b>${v}%</b></div>`}
function allowed(id){return (access[role]||[]).includes(id)}function canAction(a){return !actionAccess[a]||actionAccess[a].includes(role)}function buildNav(){const n=document.getElementById('nav');n.innerHTML='';sections.forEach(([label,ids])=>{const h=document.createElement('div');h.className='navlabel';h.textContent=label;n.appendChild(h);const box=document.createElement('div');box.className='nav';ids.filter(allowed).forEach(id=>{const b=document.createElement('button');b.dataset.go=id;b.textContent=pages[id];b.className=id===page?'active':'';box.appendChild(b)});n.appendChild(box)});document.getElementById('role').innerHTML=Object.entries(roles).map(([k,v])=>`<option value="${k}" ${k===role?'selected':''}>${v}</option>`).join('')}
function dashboard(){return head('Saturday control centre','Umpire coverage and umpire-coach coverage are planned together.',btn('Generate roster','autoRoster','primary'))+`<div class="grid kpis">${kpi('186','Games this round','Round 8')}${kpi('349','Umpire positions filled','94%','green')}${kpi('42','Coach slots required','Development','purple')}${kpi('7','Coach gaps','Action','red')}</div><div class="grid two" style="margin-top:12px"><div class="card"><h2>Roster health</h2>${metric('Umpires',94)}${metric('Coaches',83)}${metric('Coaching target',88)}${metric('Confirmations',91)}</div><div class="card"><h2>Priority exceptions</h2>${ex('100','Coach missing','Green Bib umpire requires coaching on every eligible game.',btn('Open','exceptions'),'red')}${ex('25','C Badge below target','Mia has 2 coached games from 12; target is 3.',btn('Review','coaching'),'amber')}</div></div><div class="card" style="margin-top:12px"><h2>Round workflow</h2><div class="flow">${['import','fixtures','availability','roster','exceptions','gameday','payments'].map((id,i)=>`${i?'<span class="arrow">-&gt;</span>':''}<div class="node ${id==='roster'?'blue':''}" data-go="${id}">${pages[id]}</div>`).join('')}</div></div>`}
function coaching(){const rows=levels.map(l=>[l.name,l.type,tag(l.coverage+'%',l.coverage===100?'red':l.coverage>=50?'amber':'blue'),l.coaching,l.coachLevel,l.review,btn('Edit','editLevel')]);const demand=umpires.map(u=>[u.name,u.age,u.level,u.eligible,u.coached,u.target,u.coached<u.target?tag('Below target','red'):tag('On target','green')]);return head('Coaching & development settings','Configure level types, coaching percentages, coaching methods, coach eligibility and game-level coaching rules.',btn('Add level type','addLevel','primary')+btn('Add game coaching rule','addCoachRule'))+`<div class="grid kpis">${kpi('4','Development levels')}${kpi('25%','C Badge coaching target')}${kpi('100%','Green Bib coaching target','Every game','red')}${kpi('42','Coach slots forecast','Round 8','purple')}</div><div class="card" style="margin-top:12px"><h2>Umpire level types</h2><p class="sub">Percentage is cumulative coverage over the review period. 25% means roughly one coached game in four. AutoRoster prioritises under-target umpires; it does not randomly choose 25% of games.</p>${table(['Level','Type','Coaching %','Coaching type','Required coach','Review period','Action'],rows)}</div><div class="grid two" style="margin-top:12px"><div class="card"><h2>Individual coaching position</h2>${table(['Umpire','Age','Level','Eligible','Coached','Target','Status'],demand)}</div><div class="card"><h2>Game coaching rules</h2>${coachRules.map(r=>ex(r.coverage+'%',r.name,r.match+' - '+r.reason,btn('Edit','addCoachRule'),r.coverage===100?'red':'blue')).join('')}</div></div>`}
function roster(){return head('Roster board','Each game can carry two umpire positions plus an umpire-coach position when required by the game or an umpire development level.',btn('AutoRoster','autoRoster','primary')+btn('Publish','publish'))+`<div class="card"><div class="board"><div></div><div class="court">Court 1</div><div class="court">Court 2</div><div class="court">Court 3</div><div class="time">8:00</div><div class="game" data-action="assignCoach"><b>U12 Div 1</b><small>Pizzey 1 v Mudgeeraba 1</small><div class="official">Ella J - Green Bib</div><div class="official">Grace T - C Badge</div><div class="coach">Coach: Karen W - Ella requires 100%</div></div><div class="game" data-action="assignCoach"><b>U13 Div 2</b><small>Southport 2 v Pizzey 4</small><div class="official">Ruby S - Blue Bib</div><div class="official">Jade M - B Badge</div><div class="coach">Coach: Donna R - Ruby below 75%</div></div><div class="game" data-action="assignCoach"><b>U14 Div 1</b><small>Pizzey 3 v Runaway Bay</small><div class="official">Mia P - C Badge</div><div class="official">Helen A - B Badge</div><div class="coach empty">Coach required - Mia target 2/3</div></div><div class="time">9:20</div><div class="game" data-action="assignCoach"><b>U11 Development</b><small>Pizzey 5 v Coomera 3</small><div class="official">Ava D - Green Bib</div><div class="official">Lucy H - Green Bib</div><div class="coach">Coach: Karen W - game rule 100%</div></div><div class="game" data-action="assignCoach"><b>Premier A</b><small>Pizzey A v Palm Beach A</small><div class="official">Karen W - B Badge</div><div class="official">Chloe N - B Badge</div><div class="coach">No coach required</div></div><div class="game" data-action="assignCoach"><b>U15 Div 1</b><small>Pizzey 2 v Burleigh 2</small><div class="official">Mia P - C Badge</div><div class="official">Olivia B - B Badge</div><div class="coach">Coach: Donna R - C Badge target</div></div></div></div>`}
function exceptions(){return head('Exceptions inbox','Missing coaching coverage is treated like any other roster exception.')+`<div class="card">${ex('C','Missing umpire coach','U14 Div 1 - Mia P is below her 25% C Badge coaching target.',btn('Assign coach','assignCoach'),'red')}${ex('100','Mandatory game coach missing','U11 Development requires 100% game coaching.',btn('Assign coach','assignCoach'),'red')}${ex('i','Coach clash','Donna R is already coaching another court.',btn('Review roster','roster'),'amber')}</div>`}
function gameday(){return head('Game day','Coaches check in separately. Completed coaching counts toward the umpire coaching percentage only after delivery is confirmed.',btn('Coach check-in','coachCheckin','primary'))+`<div class="card">${table(['Time','Court','Game','Umpire 1','Umpire 2','Coach','Status'],[['8:00','1','U12 Div 1','Ella J','Grace T','Karen W',state.coachCheckedIn?tag('Coach checked in','green'):tag('Awaiting coach','amber')],['8:00','3','U14 Div 1','Mia P','Helen A',tag('Unfilled','red'),tag('Missing','red')],['9:20','1','U11 Development','Ava D','Lucy H','Karen W',tag('100% required','red')]])}</div>`}
function reports(){return head('Reports & season intelligence','Measure coaching delivered versus required by umpire, level, coach and round.')+`<div class="grid kpis">${kpi('88%','Coaching target achieved','Season')}${kpi('214','Coached games delivered')}${kpi('31','Umpires with targets')}${kpi('12','Coach exceptions','Season','amber')}</div><div class="grid two" style="margin-top:12px"><div class="card"><h2>Coverage by level</h2>${metric('Green Bib',92)}${metric('Blue Bib',79)}${metric('C Badge',83)}${metric('B Badge',100)}</div><div class="card"><h2>Coach workload</h2>${table(['Coach','Games coached','Hours','Levels'],[['Karen W','44','36','Green / Blue / C'],['Donna R','31','25','Blue / C'],['Helen A','18','14','Green / Blue']])}</div></div>`}
function rules(){return head('Rules & supply','Game rules can independently create mandatory coaching positions in addition to umpire-level coaching targets.')+`<div class="grid two"><div class="card"><h2>Umpire supply rules</h2>${ex('1','Junior Saturday','Home club supplies Umpire 1; away club supplies Umpire 2.')}${ex('2','Premier','Association supplies both umpires.')}</div><div class="card"><h2>Coaching rules</h2><p class="sub">Maintain level percentages and game coaching rules in Coaching & Development.</p>${btn('Open coaching settings','coaching','primary')}</div></div>`}
function umpiresPage(){return head('Umpire register','Each umpire has a configurable development level that determines coaching need.')+`<div class="card">${table(['Umpire','Age','Level','Eligible games','Coached games','Target','Status'],umpires.map(u=>[u.name,u.age,u.level,u.eligible,u.coached,u.target,u.coached<u.target?tag('Below target','red'):tag('On target','green')]))}</div>`}
function simplePage(){return head(pages[page],`Interactive concept screen for ${pages[page]}.`)+`<div class="card"><p class="sub">This module remains wired into the concept while the detailed coaching workflow is being validated.</p>${btn('Back to dashboard','dashboard')}</div>`}
function render(){const map={dashboard,coaching,roster,exceptions,gameday,reports,rules,umpires:umpiresPage};document.getElementById('content').innerHTML=(map[page]||simplePage)();document.getElementById('pageCrumb').textContent=pages[page];buildNav()}
function go(id){if(!allowed(id)){toast('This role cannot access that screen.');return}closeDrawer();page=id;render();window.scrollTo({top:0,behavior:'smooth'})}function openDrawer(t,h){document.getElementById('drawerTitle').textContent=t;document.getElementById('drawerBody').innerHTML=h;document.getElementById('drawer').classList.add('open');document.getElementById('back').classList.add('open')}function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('back').classList.remove('open')}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),2200)}
function levelForm(e={name:'',type:'Custom',coverage:100,coaching:'',coachLevel:'Accredited Coach',review:'4 games'}){return `<div class="field"><label>Level name</label><input id="fName" value="${e.name}"></div><div class="field"><label>Level type</label><select id="fType"><option>Bib colour</option><option>Badge</option><option>Custom</option></select></div><div class="field"><label>Coaching requirement %</label><input id="fCoverage" type="number" min="0" max="100" value="${e.coverage}"></div><div class="field"><label>Coaching type</label><textarea id="fCoaching">${e.coaching}</textarea></div><div class="field"><label>Required coach level</label><input id="fCoach" value="${e.coachLevel}"></div><div class="field"><label>Review period</label><select id="fReview"><option>Round</option><option>4 games</option><option>10 games</option><option>Season</option></select></div>${btn('Save level','saveLevel','primary')}`}
function openAction(a){if(a in pages){closeDrawer();go(a);return}if(!canAction(a)){toast('This role is not authorised for that action.');return}if(a==='home'){go('dashboard');return}if(a==='season'){openDrawer('Season','2026 Winter - Pizzey Park pilot.');return}if(a==='current'){toast('You are on '+pages[page]);return}if(a==='close'){closeDrawer();return}if(a==='menu'){document.getElementById('sidebar').classList.toggle('open');return}if(a==='large'){document.getElementById('app').classList.toggle('large');return}if(a==='simple'){document.getElementById('app').classList.toggle('simple');return}if(a==='ai'){openDrawer('Roster AI','Ask which umpires are under coaching target, why a coach was assigned, or where coach shortages exist.');return}if(a==='autoRoster'){toast('AutoRoster allocated umpires and coaches using game rules plus delivered-versus-required coaching targets.');go('roster');return}if(a==='publish'){state.published=true;toast('Roster published with umpire and coach appointments.');return}if(a==='addLevel'){openDrawer('Add development level',levelForm());return}if(a==='editLevel'){openDrawer('Edit development level',levelForm(levels[2]));return}if(a==='saveLevel'){const name=document.getElementById('fName')?.value||'New level',coverage=Math.max(0,Math.min(100,Number(document.getElementById('fCoverage')?.value||0)));levels.push({name,type:document.getElementById('fType')?.value||'Custom',coverage,coaching:document.getElementById('fCoaching')?.value||'Configured coaching',coachLevel:document.getElementById('fCoach')?.value||'Accredited Coach',review:document.getElementById('fReview')?.value||'4 games'});closeDrawer();toast(name+' saved at '+coverage+'% coaching.');render();return}if(a==='addCoachRule'){openDrawer('Game coaching rule',`<div class="field"><label>Rule name</label><input id="rName" value="Development game rule"></div><div class="field"><label>Games / divisions</label><input id="rMatch" value="U11 Development"></div><div class="field"><label>Required coaching %</label><input id="rCoverage" type="number" min="0" max="100" value="100"></div>${btn('Save rule','saveCoachRule','primary')}`);return}if(a==='saveCoachRule'){coachRules.push({name:document.getElementById('rName')?.value||'New rule',match:document.getElementById('rMatch')?.value||'Configured games',coverage:Number(document.getElementById('rCoverage')?.value||100),reason:'Admin-configured rule'});closeDrawer();toast('Game coaching rule saved.');render();return}if(a==='assignCoach'){openDrawer('Assign umpire coach',`${table(['Coach','Status','Reason'],[['Donna R',tag('Best match','green'),'Available; senior coach; same venue'],['Helen A',tag('Eligible','blue'),'Available; correct level'],['Karen W',tag('Conflict','red'),'Already coaching another court']])}${btn('Assign Donna R','confirmCoach','primary')}`);return}if(a==='confirmCoach'){closeDrawer();toast('Donna R allocated as umpire coach.');return}if(a==='coachCheckin'){state.coachCheckedIn=true;toast('Coach checked in.');render();return}toast('Concept action completed.')}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){closeDrawer();go(g.dataset.go);return}const a=e.target.closest('[data-action]');if(a)openAction(a.dataset.action)});document.getElementById('role').addEventListener('change',e=>{role=e.target.value;if(!allowed(page))page='dashboard';render()});buildNav();render();
</script>
</body></html>
